<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#642631">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الأقسام">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>المساعد الذكي — MAS</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>/* MAS_DESKTOP_LIGHT_MODE: استعادة الوضع النهاري على اللابتوب قبل تحميل التنسيقات */
try{if(window.matchMedia&&window.matchMedia("(min-width: 1024px)").matches){document.documentElement.dataset.theme="light";localStorage.setItem("theme","light")}}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="stylesheet" href="theme.css">
<script>try{if(window.masWin)document.documentElement.classList.add("mas-frameless")}catch(e){}</script>
<link rel="stylesheet" href="desktop.css">
</head>
<body>
<div class="wrap xw">
<div class="x-app" id="x_app">
  <aside class="x-side" id="x_side" aria-label="المحادثات">
    <div class="x-sh"><b>المحادثات</b><button class="x-ib x-close" id="x_sclose" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <button class="x-new" id="x_new" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>محادثة جديدة</button>
    <input class="x-srch" id="x_srch" type="search" placeholder="بحث في المحادثات…" aria-label="بحث">
    <div class="x-list" id="x_list"></div>
    <div class="x-note">تُحفظ المحادثات على هذا الجهاز فقط.</div>
  </aside>
  <div class="x-scrim" id="x_scrim"></div>
  <main class="x-main">
    <header class="x-head">
      <button class="x-ib x-menu" id="x_menu" aria-label="المحادثات"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="x-av" id="x_av"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8L12 3z"/></svg></div>
      <div class="x-id"><b>مساعد MAS</b><span class="x-st" id="x_st"><i></i><em id="x_stt">متصل · قراءة وتحليل فقط</em></span></div>
      <span class="x-eng" id="x_eng" hidden></span>
      <button class="x-ib" id="x_flt" aria-label="الفترة والقسم" title="الفترة والقسم"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 8v6l-4-2v-4L4 5z"/></svg></button>
      <button class="x-ib" id="x_mem" aria-label="ذاكرة المساعد" title="ذاكرة المساعد" hidden><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4zM5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg></button>
      <button class="x-ib" id="x_lab" aria-label="مختبر التنبؤ" title="مختبر التنبؤ (تجريبي)"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 8-10M15 5h5v5"/></svg></button>
      <button class="x-ib" id="x_adm" aria-label="حالة المحركات" title="حالة المحركات" hidden><svg viewBox="0 0 24 24"><path d="M4 18V9M10 18V5M16 18v-7M21 18H3"/></svg></button>
    </header>
    <div class="x-filters" id="x_filters" hidden>
      <label>من <input type="date" id="ai_from"></label><label>إلى <input type="date" id="ai_to"></label>
      <select id="ai_sec"><option value="">كل الأقسام</option><option value="glaze">الجليز</option><option value="deco">الزخرفة</option><option value="spray">الرش</option><option value="casting">الصب</option><option value="brush">البرشر</option><option value="repair">التصليح</option></select>
      <small>الفترة الفارغة = الافتراضية من الخادم</small>
    </div>
    <div class="x-admin" id="x_admin" hidden></div>
    <div class="x-memp" id="x_memp" hidden></div>
    <div class="x-memp x-labp" id="x_labp" hidden></div>
    <section class="x-msgs" id="x_msgs" aria-live="polite"></section>
    <footer class="x-comp">
      <div class="x-box">
        <button class="x-ib" id="x_img" type="button" aria-label="قراءة صورة سجل" title="تعبئة من صورة"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4V8z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button class="x-ib" id="x_fillb" type="button" aria-pressed="false" aria-label="وضع تعبئة البيانات" title="وضع تعبئة البيانات"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4zM14 7l3 3"/></svg></button>
        <input type="file" id="x_file" accept="image/*" hidden>
        <textarea id="ai_q" rows="1" maxlength="1500" placeholder="اسأل عن إنتاج المصنع أو اطلب تقريرًا…" aria-label="سؤالك"></textarea>
        <button id="ai_go" class="x-send" type="button" aria-label="إرسال"><svg viewBox="0 0 24 24" class="s-send"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg><svg viewBox="0 0 24 24" class="s-stop"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
      </div>
      <small class="x-hint" id="x_hint">Enter للإرسال · Shift+Enter سطر جديد · المساعد لا يعدّل أي بيانات</small>
    </footer>
  </main>
</div>
<style>
.xw{max-width:none!important;padding:0!important}
.x-app{--xh:calc(100dvh - 74px);display:grid;grid-template-columns:290px 1fr;height:var(--xh);min-height:480px;background:var(--bg);position:relative;overflow:hidden}
.x-app svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.x-side{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--card);border-inline-end:1px solid var(--line);min-height:0}
.x-sh{display:flex;align-items:center;justify-content:space-between}.x-sh b{font-size:16px}.x-sh .x-close{display:none}
.x-new{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(135deg,#8a3447,#642631 55%,#421B24);box-shadow:0 6px 16px #64263140;transition:transform .15s}
.x-new:active{transform:scale(.97)}
.x-srch{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:9px 12px;font:inherit;font-size:14.5px}
.x-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;min-height:0}
.x-it{display:flex;align-items:center;gap:6px;border-radius:12px;padding:9px 10px;cursor:pointer;border:1px solid transparent;font-size:14.5px}
.x-it:hover{background:var(--bg)}.x-it.on{background:color-mix(in srgb,var(--pri) 12%,transparent);border-color:color-mix(in srgb,var(--pri) 35%,transparent)}
.x-it span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x-it button{border:0;background:none;color:var(--mute);cursor:pointer;padding:4px;border-radius:8px;opacity:.0}.x-it:hover button,.x-it.on button{opacity:1}.x-it button:hover{color:var(--bad)}
.x-it button svg{width:16px;height:16px}
.x-empty{color:var(--mute);font-size:13.5px;text-align:center;padding:14px}
.x-note{font-size:12.5px;color:var(--mute);text-align:center}
.x-main{font-size:15.5px;display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(600px 300px at 100% 0,color-mix(in srgb,var(--pri) 9%,transparent),transparent 70%),var(--bg)}
.x-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(12px)}
.x-ib{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;flex:none;font:inherit}
.x-ib:hover{border-color:var(--pri);color:var(--pri)}.x-menu{display:none}
.x-av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(135deg,#a24357,#642631 55%,#421B24);box-shadow:0 6px 16px #64263145;position:relative}
.x-av svg{width:22px;height:22px;fill:#fff;stroke:none}
.x-av::after{content:"";position:absolute;inset:-4px;border-radius:17px;border:2px solid #d9b86a;opacity:0}
.x-app.busy .x-av::after{animation:xpulse 1.4s ease-out infinite}.x-app.busy .x-av svg{animation:xspin 2.4s linear infinite}
@keyframes xpulse{0%{opacity:.8;transform:scale(.9)}100%{opacity:0;transform:scale(1.25)}}@keyframes xspin{to{transform:rotate(360deg)}}
.x-id{flex:1;min-width:0;display:flex;flex-direction:column}.x-id b{font-size:17.5px}
.x-st em{font-style:normal}.x-st{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}.x-st i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.x-st.off i{background:var(--bad);box-shadow:none}
.x-eng{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mute);white-space:nowrap}
.x-filters,.x-admin{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);font-size:14.5px}
.x-filters[hidden],.x-admin[hidden]{display:none}
.x-filters input,.x-filters select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 8px;font:inherit}
.x-filters small{color:var(--mute);font-size:12.5px}
.x-admin .pv{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.x-admin button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:13.5px;cursor:pointer}
.x-admin .k{color:var(--ok)}.x-admin .n{color:var(--bad)}
.x-msgs{flex:1;overflow-y:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px;min-height:0;scroll-behavior:smooth}
.x-m{max-width:min(820px,94%);display:flex;flex-direction:column;gap:6px;animation:xin .3s both}
@keyframes xin{from{opacity:0;transform:translateY(8px)}}
.x-m.u{align-self:flex-start}.x-m.a{align-self:flex-end;width:100%;max-width:820px;margin-inline:auto}
.x-m.u .x-b{background:linear-gradient(135deg,#7d3243,#642631);color:#fff;border-radius:18px 18px 4px 18px;padding:10px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.8}
.x-m.a .x-b{background:var(--card);border:1px solid var(--line);border-radius:18px 4px 18px 18px;padding:12px 16px;box-shadow:var(--sh)}
.x-m.err .x-b{border-color:var(--bad);color:var(--bad)}
.ai-md{line-height:1.9;font-size:15.5px;overflow-wrap:anywhere}
.ai-md h2{font-size:17.5px;margin:12px 0 6px;color:var(--pri);border-bottom:1px solid var(--line);padding-bottom:4px}.ai-md h2:first-child{margin-top:0}
.ai-md h3{font-size:15.5px;margin:10px 0 4px}.ai-md ul{margin:4px 0;padding-inline-start:20px}.ai-md p{margin:6px 0}
.ai-md code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:14px;direction:ltr;unicode-bidi:embed}
.ai-md pre{background:#1d1417;color:#f4e9ec;border-radius:12px;padding:10px 12px;overflow-x:auto;direction:ltr;text-align:left;font-size:14px}
.ai-md .tw{overflow-x:auto;margin:8px 0}.ai-md table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:280px}
.ai-md th,.ai-md td{border:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
.ai-md th{background:#642631;color:#fff}.ai-md tr:nth-child(even) td{background:var(--bg)}
.x-chart{margin:6px 0 10px;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.x-bar{display:grid;grid-template-columns:minmax(70px,26%) 1fr auto;gap:8px;align-items:center}
.x-bar>div{height:14px;border-radius:7px;background:var(--line);overflow:hidden}.x-bar>div>i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#c0556a,#642631);transform-origin:right;animation:xgrow .6s both}
@keyframes xgrow{from{transform:scaleX(0)}}
.x-meta{font-size:12.5px;color:var(--mute);padding-inline:4px}
.x-acts{display:flex;flex-wrap:wrap;gap:4px}
.x-acts button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:9px;padding:4px 9px;font:inherit;font-size:13.5px;cursor:pointer;display:flex;gap:4px;align-items:center}
.x-acts button:hover{color:var(--pri);border-color:var(--pri)}.x-acts button.on{color:var(--pri);border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,transparent)}
.x-think{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14.5px}
.x-dots{display:flex;gap:4px}.x-dots i{width:7px;height:7px;border-radius:50%;background:var(--pri);animation:xd 1.1s infinite ease-in-out}.x-dots i:nth-child(2){animation-delay:.15s}.x-dots i:nth-child(3){animation-delay:.3s}
@keyframes xd{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}
.x-welcome{margin:auto;text-align:center;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
.x-welcome .big{width:78px;height:78px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(135deg,#a24357,#642631 55%,#421B24);box-shadow:0 14px 34px #64263150;animation:xfl 4s ease-in-out infinite}
.x-welcome .big svg{width:38px;height:38px;fill:#fff;stroke:none}@keyframes xfl{50%{transform:translateY(-6px)}}
.x-welcome h2{margin:6px 0 0;font-size:25px}.x-welcome p{margin:0;color:var(--mute);font-size:15px;line-height:1.8}
.x-chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:8px}
.x-chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font:inherit;font-size:14.5px;cursor:pointer;text-align:right;transition:.15s}
.x-chips button:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:var(--sh)}
.x-comp{padding:8px 14px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px}
.x-box{display:flex;align-items:flex-end;gap:8px;max-width:820px;width:100%;margin-inline:auto;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px;box-shadow:var(--sh);transition:border-color .2s}
.x-box:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 20%,transparent)}
.x-box textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--ink);font:inherit;font-size:16px;line-height:1.7;max-height:150px;padding:6px 8px}
.x-send{width:42px;height:42px;border-radius:14px;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;background:linear-gradient(135deg,#8a3447,#642631);flex:none;transition:.15s}
.x-send:disabled{opacity:.4;cursor:default}.x-send .s-stop{display:none;fill:#fff;stroke:none}.x-app.busy .x-send .s-send{display:none}.x-app.busy .x-send .s-stop{display:block}.x-app.busy .x-send{background:var(--bad)}
.x-hint{text-align:center;font-size:12.5px;color:var(--mute)}
.x-ib[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.x-imp{display:flex;flex-direction:column;gap:10px}
.x-imp-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.x-imp-h b{font-size:16px;flex:1}
.bdg{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid}.bdg.high{color:var(--ok);border-color:var(--ok)}.bdg.medium{color:var(--warn);border-color:var(--warn)}.bdg.low{color:var(--bad);border-color:var(--bad)}
.x-imp label{font-size:12.5px;color:var(--mute);display:block;margin-bottom:2px}
.x-imp input,.x-imp select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 9px;font:inherit;font-size:14.5px;min-width:0}
.x-imp input:focus,.x-imp select:focus{outline:2px solid color-mix(in srgb,var(--pri) 45%,transparent);border-color:var(--pri)}
.x-imp-m{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.x-ir{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr auto;gap:6px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:8px;background:color-mix(in srgb,var(--bg) 60%,transparent)}
.x-ir .w{grid-column:auto}.x-ir.bad{border-color:var(--bad)}.x-ir.warn{border-color:var(--warn)}
.x-ir .rm{border:0;background:none;color:var(--mute);cursor:pointer;font-size:17.5px;padding:6px}.x-ir .rm:hover{color:var(--bad)}
.x-ir .rn{grid-column:1/-1;font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.x-ir .rn button{border:1px dashed var(--pri);background:none;color:var(--pri);border-radius:8px;padding:1px 8px;font:inherit;font-size:13px;cursor:pointer}
.x-chk{display:flex;flex-direction:column;gap:3px;font-size:14px}.x-chk .e{color:var(--bad)}.x-chk .w{color:var(--warn)}.x-chk .o{color:var(--ok)}
.x-imp .acts2{display:flex;gap:8px;flex-wrap:wrap}.x-imp .acts2 button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;font:inherit;font-size:14.5px;cursor:pointer}
.x-imp .acts2 .p{background:linear-gradient(135deg,#8a3447,#642631);color:#fff;border:0;font-weight:700}.x-imp .acts2 .p:disabled{opacity:.45;cursor:default}
.x-app .i{width:17px;height:17px;stroke-width:1.9}
.x-who{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink);padding-inline:2px}
.x-who span{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#a24357,#642631)}
.x-who span svg{width:14px;height:14px;fill:#fff;stroke:none}
.x-acts button{font-weight:500;letter-spacing:0}.x-acts button.on{font-weight:700}
.x-chips button{display:flex;align-items:center;gap:10px;line-height:1.6;font-weight:500}.x-chips button svg{color:var(--pri);flex:none}
.x-chk div{display:flex;gap:7px;align-items:flex-start;line-height:1.7}.x-chk .i{margin-top:3px}
.x-imp-h b{display:flex;align-items:center;gap:8px}
.x-imp .acts2 button{display:flex;align-items:center;gap:6px}
.x-ir .rm{display:grid;place-items:center}
.x-box textarea,.x-imp input,.x-imp select,.x-srch,.x-filters input,.x-filters select{font-size:16px}
.x-memp{padding:14px;border-bottom:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow-y:auto}
.x-memp[hidden]{display:none}.x-memp .mh{display:flex;flex-direction:column;gap:2px}.x-memp .mh b{font-size:16px}.x-memp .mh small{color:var(--mute);font-size:13px;line-height:1.6}
.x-memp .mf{display:grid;grid-template-columns:130px 1fr 1.6fr auto auto;gap:8px}
.x-memp input,.x-memp select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px;min-width:0}
.x-memp input:focus,.x-memp select:focus{outline:2px solid color-mix(in srgb,var(--pri) 45%,transparent);border-color:var(--pri)}
.x-memp .mf button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;font-size:14.5px;cursor:pointer}
.x-memp .mf .p{background:linear-gradient(135deg,#8a3447,#642631);color:#fff;border:0;font-weight:700}
.x-ml{display:flex;flex-direction:column;gap:6px}
.x-mi{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px}

.lb-t th{color:var(--mute);font-weight:500;background:var(--bg)}.lb-t tbody tr:nth-child(even) td{background:transparent}.lb-t tr.win td{background:color-mix(in srgb,var(--ok) 12%,transparent);font-weight:700}

@media(max-width:520px){.x-st em{display:none}.x-head .x-ib{width:36px;height:36px}.x-head{padding:8px 10px}}
.x-imp .acts2 .dg{background:var(--bad);color:#fff;border:0;font-weight:700}.x-imp .acts2 .dg:disabled{opacity:.45;cursor:default}
.x-del td:first-child,.x-del th:first-child{width:34px}.x-del input[type=checkbox]{width:18px;height:18px;accent-color:var(--bad)}

 .x-app{--xh:calc(100dvh - 66px);grid-template-columns:1fr}
 .x-side{position:absolute;inset-block:0;inset-inline-start:0;width:min(310px,86%);z-index:30;transform:translateX(105%);transition:transform .25s}
 .x-app.so .x-side{transform:none;box-shadow:-10px 0 30px #0005}.x-app.so .x-scrim{display:block;position:absolute;inset:0;z-index:20;background:#0006}
 .x-menu,.x-sh .x-close{display:grid}.x-chips{grid-template-columns:1fr}.x-chips button{padding:10px 12px}.x-welcome .big{width:64px;height:64px;border-radius:22px}.x-ir{grid-template-columns:1fr 1fr auto}.x-ir .it,.x-ir .w{grid-column:1/-1}.x-hint{display:none}.x-eng{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $=id=>document.getElementById(id);
const P={copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/>',
 up:'<path d="M7 11v9H4v-9h3zM7 11l4-7c1.5 0 2.5 1 2.2 2.6L12.8 10H19a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/>',
 down:'<path d="M7 13V4H4v9h3zM7 13l4 7c1.5 0 2.5-1 2.2-2.6L12.8 14H19a2 2 0 0 0 2-2.3l-1.2-6A2 2 0 0 0 17.8 4H7"/>',
 pdf:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
 sheet:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',alert:'<path d="M12 4l9 16H3L12 4zM12 10v4M12 17.5v.01"/>',
 clip:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',spark:'<path d="M12 3l1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8L12 3z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="M4 20l4-1 11-11-3-3L5 16l-1 4zM14 7l3 3"/>',trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',book:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4zM5 17a3 3 0 0 1 3-3h11M9 8h6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>'};
const ic=n=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+P[n]+'</svg>';
const SUG=["عرّف بنفسك وبيّن ما تستطيع فعله","ملخص إداري للفترة","قارن إنتاج الأقسام","حلّل نسب الهالك وأسبابها المحتملة","استهلاك الجليز والألوان","أعلى الأصناف إنتاجًا"],SUGI=["info","clip","chart","alert","sheet","chart"];
const WHO='<div class="x-who"><span>'+ic('spark')+'</span>مساعد MAS</div>';
const ENG={gemini:"Gemini",groq:"Groq",openrouter:"OpenRouter"};
const THINK=["أقرأ بيانات المصنع…","أحسب وأقارن الأرقام…","أجهّز الإجابة…"];
const SECN={casting:"الصب",brush:"البرشر",glaze:"الجليز",deco:"الزخرفة",spray:"الرش",repair:"التصليح",finish:"التشطيب",fire:"الحريق"};
const SEC_PAGE={casting:"casting.html",brush:"brush.html",glaze:"glaze.html",deco:"decoration.html",spray:"spray.html",repair:"repair.html",finish:"finish.html",fire:"fire.html"};
let ITEMS=null,fillMode=false;
let K,chats=[],cur=null,busy=false,gen=0,tick=null;

/* ---------- تخزين محلي لكل مستخدم ---------- */
const load=()=>{try{return JSON.parse(localStorage.getItem(K)||"[]")}catch(e){return[]}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(chats.slice(0,30)))}catch(e){toast("تعذّر حفظ المحادثة على الجهاز","warn")}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Markdown آمن: نهرّب HTML أولًا ثم نحوّل عناصر محدودة ---------- */
function mdToHtml(src){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const lines=String(src||"").replace(/\r/g,"").split("\n");let out="",list=false,i=0;
  const cl=()=>{if(list){out+="</ul>";list=false}};
  while(i<lines.length){
    const l=lines[i].trim();
    if(l.startsWith("```")){cl();let c="";i++;while(i<lines.length&&!lines[i].trim().startsWith("```")){c+=lines[i]+"\n";i++}i++;out+="<pre><code>"+esc(c)+"</code></pre>";continue}
    if(/^\|.*\|$/.test(l)&&i+1<lines.length&&/^\|[\s:|-]+\|$/.test(lines[i+1].trim())){
      cl();const row=x=>x.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head=row(l);i+=2;let b="";
      while(i<lines.length&&/^\|.*\|$/.test(lines[i].trim())){b+="<tr>"+row(lines[i]).map(c=>"<td>"+inl(c)+"</td>").join("")+"</tr>";i++}
      out+='<div class="tw"><table><thead><tr>'+head.map(c=>"<th>"+inl(c)+"</th>").join("")+"</tr></thead><tbody>"+b+"</tbody></table></div>";continue}
    let m;
    if((m=l.match(/^#{1,2}\s+(.+)/))){cl();out+="<h2>"+inl(m[1])+"</h2>"}
    else if((m=l.match(/^#{3,}\s+(.+)/))){cl();out+="<h3>"+inl(m[1])+"</h3>"}
    else if((m=l.match(/^[-*•]\s+(.+)/))||(m=l.match(/^\d+[.)]\s+(.+)/))){if(!list){out+="<ul>";list=true}out+="<li>"+inl(m[1])+"</li>"}
    else if(l===""){cl()}else{cl();out+="<p>"+inl(l)+"</p>"}
    i++;
  }
  cl();return out;
}
const num=s=>{const n=parseFloat(String(s).replace(/[,٬\s%]/g,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)));return isFinite(n)?n:null};

/* ---------- عرض ---------- */
const scrollDown=()=>{const m=$("x_msgs");m.scrollTop=m.scrollHeight};
function msgEl(m,i){
  const d=document.createElement("div");d.className="x-m "+(m.r==="u"?"u":"a")+(m.err?" err":"");d.dataset.i=i;
  if(m.r==="u"){d.innerHTML='<div class="x-b">'+esc(m.t)+"</div>";return d}
  if(m.del){d.innerHTML=WHO+'<div class="x-b x-imp"></div>';delDraw(d,m);return d}
  if(m.res){d.innerHTML=WHO+'<div class="x-b ai-md"><p>'+esc(m.t)+'</p></div>'+(m.res.log_id&&!m.res.undone?'<div class="x-acts"><button data-a="undo">'+ic("refresh")+'تراجع عن هذه العملية</button></div>':"");return d}
  if(m.imp){d.innerHTML=WHO+'<div class="x-b x-imp"></div>';impDraw(d,m);return d}
  if(m.err){d.innerHTML='<div class="x-b">'+esc(m.t)+'</div>'+(m.q?'<div class="x-acts"><button data-a="retry">'+ic("refresh")+'إعادة المحاولة</button></div>':"")+'';return d}
  d.innerHTML=WHO+'<div class="x-b ai-md">'+mdToHtml(m.t)+'</div><div class="x-meta">'+esc(m.meta||"")+'</div><div class="x-acts"><button data-a="copy">'+ic("copy")+'نسخ</button><button data-a="regen">'+ic("refresh")+'إعادة توليد</button><button data-a="up" aria-label="مفيدة" title="مفيدة" class="'+(m.fb==="up"?"on":"")+'">'+ic("up")+'</button><button data-a="down" aria-label="غير مفيدة" title="غير مفيدة" class="'+(m.fb==="down"?"on":"")+'">'+ic("down")+'</button><button data-a="pdf">'+ic("pdf")+'PDF / طباعة</button><button data-a="csv">'+ic("sheet")+'Excel (جداول)</button>'+(CANMEM()?'<button data-a="mem">'+ic("book")+'حفظ تصحيح</button>':"")+'</div>';
  d.querySelectorAll("table").forEach(t=>{ // رسم بياني بسيط للجداول الرقمية
    const rows=[...t.querySelectorAll("tbody tr")].map(r=>[r.children[0]?.textContent||"",num(r.children[1]?.textContent)]).filter(x=>x[1]!==null);
    if(rows.length<2||rows.length>15)return;
    const b=document.createElement("button");b.innerHTML=ic("chart")+"رسم بياني";b.dataset.a="chart";b._rows=rows;b._t=t;d.querySelector(".x-acts").appendChild(b);
  });
  return d;
}
function render(){
  const box=$("x_msgs"),c=cur;box.innerHTML="";
  if(!c||!c.m.length){
    box.innerHTML='<div class="x-welcome"><div class="big"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8L12 3z"/></svg></div><h2>أهلًا بك، أنا مساعد MAS</h2><p>أقرأ بيانات الإنتاج والهالك والجليز والألوان وأحوّلها إلى ملخصات وتقارير إدارية. الأرقام من قاعدة البيانات وبحسب صلاحياتك، ولا أعدّل أي بيانات.</p><div class="x-chips">'+SUG.map((s,i)=>'<button type="button">'+ic(SUGI[i])+"<span>"+esc(s)+"</span></button>").join("")+"</div></div>";
  }else c.m.forEach((m,i)=>box.appendChild(msgEl(m,i)));
  if(!c||!c.m.length)box.scrollTop=0;else scrollDown();
}
function renderList(){
  const q=$("x_srch").value.trim().toLowerCase();
  const a=chats.filter(c=>!q||c.title.toLowerCase().includes(q)||c.m.some(m=>m.t.toLowerCase().includes(q)));
  $("x_list").innerHTML=a.length?a.map(c=>'<div class="x-it'+(cur&&c.id===cur.id?" on":"")+'" data-id="'+c.id+'"><span>'+esc(c.title)+'</span><button data-del="'+c.id+'" aria-label="حذف"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button></div>').join(""):'<div class="x-empty">'+(q?"لا نتائج":"لا توجد محادثات بعد")+"</div>";
}
function setBusy(v){busy=v;$("x_app").classList.toggle("busy",v);$("ai_q").disabled=false;$("ai_go").setAttribute("aria-label",v?"إيقاف":"إرسال")}
function openChat(id){cur=chats.find(c=>c.id===id)||null;render();renderList();$("x_app").classList.remove("so")}
function newChat(){if(busy)stop();cur=null;render();renderList();$("x_app").classList.remove("so");$("ai_q").focus()}

/* ---------- إرسال (مع منع التكرار والإيقاف) ---------- */
function ctxQ(q){ // سياق مختصر من آخر تبادل، بحدّ الخادم 1500 حرف
  if(!cur)return q;const m=cur.m.filter(x=>!x.err);const lu=[...m].reverse().find(x=>x.r==="u"),la=[...m].reverse().find(x=>x.r==="a");
  if(!lu||!la)return q;
  const pre="[سياق المحادثة السابق — للفهم فقط]\nسؤال سابق: "+lu.t.slice(0,200)+"\nملخص الرد السابق: "+la.t.replace(/\s+/g," ").slice(0,350)+"\n[السؤال الحالي]\n";
  return pre.length+q.length<=1500?pre+q:q;
}
async function askQ(q,regen){
  if(busy)return;q=q.trim();if(q.length<2){toast("اكتب سؤالك","bad");return}
  if(!cur){cur={id:uid(),title:q.slice(0,40),m:[],t:Date.now()};chats.unshift(cur)}
  if(!regen)cur.m.push({r:"u",t:q});
  save();render();renderList();
  const th=document.createElement("div");th.className="x-m a";th.innerHTML='<div class="x-b x-think"><span class="x-dots"><i></i><i></i><i></i></span><span id="x_tt">'+THINK[0]+"</span></div>";$("x_msgs").appendChild(th);scrollDown();
  let n=0;clearInterval(tick);tick=setInterval(()=>{const e=$("x_tt");if(e)e.textContent=THINK[++n%THINK.length]},2600);
  setBusy(true);const my=++gen,chat=cur;
  const body={action:"ask",question:ctxQ(q)};
  if($("ai_from").value)body.from=$("ai_from").value;if($("ai_to").value)body.to=$("ai_to").value;if($("ai_sec").value)body.sections=[$("ai_sec").value];
  const r=await masAi(body);
  if(my!==gen)return; // تم الإيقاف
  clearInterval(tick);setBusy(false);
  if(!r.ok){chat.m.push({r:"a",t:r.msg||"تعذّر الاتصال بالمساعد",err:1,q});markOff(r.code==="network"||r.code==="offline")}
  else{markOff(false);const d=r.data,p=ENG[d.provider]||d.provider||"";
    chat.m.push({r:"a",t:d.answer||"",q,ctx:{q,period:d.period,section:$("ai_sec").value||""},
      meta:"الفترة: \u2066"+d.period.from+"\u2069 إلى \u2066"+d.period.to+"\u2069"+" · المحرك: "+p+(d.failover?" (تحويل تلقائي)":"")+" · المصدر: بيانات المصنع الفعلية"});
    $("x_eng").hidden=false;$("x_eng").textContent="المحرك: "+p+(d.failover?" · تحويل تلقائي":"")}
  chat.m=chat.m.slice(-40);save();if(cur===chat)render();renderList();
}
function stop(){gen++;clearInterval(tick);setBusy(false);if(cur){cur.m.push({r:"a",t:"تم إيقاف التوليد.",err:1,q:[...cur.m].reverse().find(x=>x.r==="u")?.t});save();render()}}
function markOff(off){$("x_st").classList.toggle("off",off);$("x_stt").textContent=off?"غير متصل — تحقّق من الإنترنت":CANWRITE?"متصل · الكتابة المفوّضة مفعّلة":"متصل · قراءة وتحليل فقط"}

/* ---------- أزرار الرسائل ---------- */
function csv(el){
  const tbs=el.querySelectorAll("table");if(!tbs.length){toast("لا توجد جداول في هذه الإجابة","bad");return}
  let s="";tbs.forEach(t=>{t.querySelectorAll("tr").forEach(r=>{s+=[...r.children].map(c=>'"'+c.textContent.replace(/"/g,'""')+'"').join(",")+"\n"});s+="\n"});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv;charset=utf-8"}));a.download="mas-ai-"+new Date().toISOString().slice(0,10)+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$("x_msgs").onclick=async e=>{
  const sug=e.target.closest(".x-chips button");if(sug){$("ai_q").value=sug.textContent;askQ(sug.textContent);$("ai_q").value="";return}
  const b=e.target.closest("[data-a]");if(!b)return;const w=b.closest(".x-m"),i=+w.dataset.i,m=cur.m[i],a=b.dataset.a;
  if(a==="copy"){try{await navigator.clipboard.writeText(m.t);toast("تم النسخ","ok")}catch(x){toast("تعذّر النسخ","bad")}}
  else if(a==="regen"||a==="retry"){if(busy)return;const q=m.q;cur.m.splice(i,1);askQ(q,true)}
  else if(a==="up"||a==="down"){m.fb=m.fb===a?"":a;save();b.parentNode.querySelectorAll("[data-a=up],[data-a=down]").forEach(x=>x.classList.toggle("on",x.dataset.a===m.fb));toast(m.fb?"شكرًا على تقييمك":"أُلغي التقييم","ok")}
  else if(a==="pdf"){const c=m.ctx||{};AiPrint.print({md:m.t,question:c.q||m.q,period:c.period,section:c.section,title:"تقرير الذكاء الاصطناعي"})}
  else if(a==="csv")csv(w.querySelector(".ai-md"));
  else if(a==="mem")openMem({kind:"correction"});
  else if(a==="undo"){if(WBUSY||!m.res)return;if(!confirm("التراجع عن هذه العملية وإرجاع الوضع السابق؟"))return;WBUSY=true;const r=await masAi({action:"write_undo",log_id:m.res.log_id},{retries:0});WBUSY=false;if(!r.ok){toast(r.msg||"تعذّر التراجع","bad");return}m.res.undone=true;m.t+=" (تم التراجع)";save();render();toast("تم التراجع","ok")}
  else if(a==="chart"){const old=w.querySelector(".x-chart");if(old){old.remove();return}
    const rows=b._rows,mx=Math.max(...rows.map(r=>Math.abs(r[1])))||1,c=document.createElement("div");c.className="x-chart";
    c.innerHTML=rows.map(r=>'<div class="x-bar"><span>'+esc(r[0])+'</span><div><i style="width:'+Math.max(2,Math.abs(r[1])/mx*100)+'%"></i></div><b>'+esc(String(r[1]))+"</b></div>").join("");
    b._t.parentNode.after(c)}
};

/* ---------- لوحة المحركات (للمدير فقط) ---------- */
async function adminPanel(){
  const p=$("x_admin");p.hidden=!p.hidden;if(p.hidden)return;$("x_memp").hidden=true;$("x_labp").hidden=true;p.textContent="جارٍ التحميل…";
  const r=await masAi({action:"status"},{retries:0});
  if(!r.ok){p.textContent=r.msg;return}
  const d=r.data;
  p.innerHTML='<b>الأساسي: '+esc(ENG[d.primary]||d.primary)+" · الاحتياطي: "+esc(ENG[d.fallback]||d.fallback||"—")+" · التحويل التلقائي: "+(d.auto_failover?"مفعّل":"موقوف")+" · المساعد: "+(d.enabled?"مفعّل":"موقوف")+"</b>"+
    d.providers.map(x=>'<span class="pv">'+esc(x.label||x.id)+' <span class="'+(x.key_configured?"k":"n")+'">'+(x.key_configured?"المفتاح موجود":"المفتاح غير مضبوط")+'</span><button data-t="'+esc(x.id)+'">اختبار</button></span>').join("")+
    '<a href="settings.html">إعدادات المساعد</a>';

const LAG=7,DAYS_AR=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function rngS(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}
function mkSeries(rows,from,to){

  let i=0;while(i<o.length&&o[i].y===0)i++;return o.slice(i);
}
const featOf=(y,w,t,sc)=>{const f=[];for(let k=1;k<=LAG;k++)f.push((y[t-k]||0)/sc);for(let d=0;d<7;d++)f.push(w[t]===d?1:0);return f};
function trainMLP(X,Y,seed,H=12,ep=500,lr=0.01,wd=1e-3){

  for(let i=0;i<H*n;i++)th[i]=(r()-.5)*2*Math.sqrt(2/n);for(let i=0;i<H;i++)th[H*n+H+i]=(r()-.5)*.8;

    for(let s=0;s<N;s++){const x=X[s];let o=th[P-1];
      for(let j=0;j<H;j++){let z=th[H*n+j];for(let k=0;k<n;k++)z+=th[j*n+k]*x[k];h[j]=Math.tanh(z);o+=th[H*n+H+j]*h[j]}

      for(let j=0;j<H;j++){g[H*n+H+j]+=d*h[j];const dz=d*th[H*n+H+j]*(1-h[j]*h[j]);g[H*n+j]+=dz;for(let k=0;k<n;k++)g[j*n+k]+=dz*x[k]}}

const BASE={

const LAB_AR={naive:"أمس (بسيط)",ma7:"متوسط 7 أيام",seasonal:"نفس اليوم الأسبوع الماضي",linear:"انحدار خطي",nn:"الشبكة العصبية"};
function labRun(S){

  const tr=mk(LAG,ts),ens=(X,Y)=>{const ms=[1,2,3].map(sd=>trainMLP(X,Y,sd*7919));return x=>ms.reduce((a,f)=>a+f(x),0)/ms.length};
  const lin=trainRidge(tr.X,tr.Y),nn=ens(tr.X,tr.Y);
  const preds={};for(const k of Object.keys(BASE))preds[k]=[];preds.linear=[];preds.nn=[];
  for(let t=ts;t<n;t++){for(const k of Object.keys(BASE))preds[k].push(BASE[k](y,w,t));const f=featOf(y,w,t,sc);preds.linear.push(Math.max(0,lin(f)*sc));preds.nn.push(Math.max(0,nn(f)*sc))}

  const full=mk(LAG,n);let pf;
  if(win==="nn")pf=(()=>{const f=ens(full.X,full.Y);return(yy,ww,t)=>Math.max(0,f(featOf(yy,ww,t,sc))*sc)})();

  return{ok:true,n,nz,H,res,win,imp,verdict,fc,hist:S.slice(-42)};
}

        else if(!f.data.rows.length)say("لم أجد سجلات مطابقة في قسم "+nm+". عدّل شروط الأمر.");
        else chat.m.push({r:"a",t:"حذف",del:{sec:it.section,rows:f.data.rows,sel:[]}})}
    }else say("لم أفهم الأمر كإضافة أو حذف. اكتب مثلًا: «سجّل في الصب طقم ٦ قطع ٣٠٠» أو «احذف سجلات البرشر ليوم ٢٠ نوفمبر».")}
  setBusy(false);chat.m=chat.m.slice(-40);save();if(cur===chat)render();renderList();
}
async function writeSave(w,m){
  const v=m.imp,{E}=validate(v);if(E.length){toast(E[0],"bad");return}
  const rows=v.rows.filter(r=>r.item||r.qty!=null).map(r=>({item:r.item,qty:r.qty,scrap:r.scrap,worker:r.worker,shift:r.shift,note:r.note}));
  if(!confirm("سيتم حفظ "+rows.length+" سجل في قسم "+WS[v.section]+" بتاريخ "+v.date+" مباشرة في قاعدة البيانات. يمكنك التراجع خلال 7 أيام. متابعة؟"))return;
  if(WBUSY)return;WBUSY=true;const btn=w.querySelector("[data-ia=save]");if(btn)btn.disabled=true;
  const r=await masAi({action:"write_add",sec:v.section,date:v.date,rows},{retries:0});WBUSY=false;
  if(!r.ok){toast(r.msg||"تعذّر الحفظ","bad");if(btn)btn.disabled=false;return}
  const i=cur.m.indexOf(m);cur.m[i]={r:"a",t:"تم حفظ "+r.data.count+" سجل في قسم "+WS[v.section]+" بتاريخ "+v.date+".",res:{log_id:r.data.log_id}};save();render();toast("تم الحفظ","ok");
}

   v.rows.map(r=>'<tr><td><input type="checkbox" data-ds="'+r.id+'" '+(v.sel.includes(r.id)?"checked":"")+' aria-label="تحديد"></td><td>'+esc(r.date)+"</td><td>"+esc(r.item||"")+"</td><td>"+esc(r.qty??"")+"</td><td>"+esc(r.scrap??"")+"</td><td>"+esc(r.worker||"")+"</td></tr>").join("")+"</tbody></table></div>"+
   '<div class="x-chk"><div class="w">'+ic("alert")+"الحذف نهائي من قاعدة البيانات، ويمكنك التراجع خلال 7 أيام من هذه المحادثة.</div></div>"+
   '<div class="acts2"><button type="button" data-ia="dall">'+(n===v.rows.length?"إلغاء التحديد":"تحديد الكل")+'</button><button type="button" class="dg" data-ia="del" '+(n?"":"disabled")+'>'+ic("trash")+" حذف المحدد ("+n+")</button></div>";
}
$("x_msgs").addEventListener("change",e=>{const c=e.target.closest("[data-ds]");if(!c)return;const w=c.closest(".x-m"),m=cur&&cur.m[+w.dataset.i];if(!m||!m.del)return;
  const id=+c.dataset.ds,s=m.del.sel;if(c.checked){if(!s.includes(id))s.push(id)}else m.del.sel=s.filter(x=>x!==id);delDraw(w,m)});
$("x_msgs").addEventListener("click",async e=>{
  const ia=e.target.closest("[data-ia]");if(!ia||!cur)return;const w=ia.closest(".x-m"),m=cur.m[+w.dataset.i];if(!m)return;
  if(m.imp&&ia.dataset.ia==="save"){writeSave(w,m);return}
  if(!m.del)return;const v=m.del,a=ia.dataset.ia;
  if(a==="dall"){v.sel=v.sel.length===v.rows.length?[]:v.rows.map(r=>r.id);delDraw(w,m)}
  else if(a==="del"){if(!v.sel.length||WBUSY)return;
    if(!confirm("سيتم حذف "+v.sel.length+" سجل نهائيًا من قسم "+WS[v.sec]+". يمكنك التراجع خلال 7 أيام. متابعة؟"))return;
    WBUSY=true;ia.disabled=true;const r=await masAi({action:"write_delete",sec:v.sec,ids:v.sel,confirm:true},{retries:0});WBUSY=false;
    if(!r.ok){toast(r.msg||"تعذّر الحذف","bad");ia.disabled=false;return}
    const i=cur.m.indexOf(m);cur.m[i]={r:"a",t:"تم حذف "+r.data.deleted+" سجل من قسم "+WS[v.sec]+".",res:{log_id:r.data.log_id}};save();render();toast("تم الحذف","ok")}
});

/* ---------- ذاكرة المساعد: مصطلحات وتصحيحات يعتمدها المدير ويستخدمها المساعد في كل إجابة ---------- */
const CANMEM=()=>!!ME&&(ME.role==="admin"||ME.role==="owner");
const KIND_AR={term:"مصطلح",correction:"تصحيح",rule:"قاعدة"};
let MEM=[],memEdit=null,memMsg="";
const memErr=e=>/does not exist|schema cache|42P01|PGRST205/.test((e.code||"")+(e.message||""))?"جدول الذاكرة غير مُنشأ بعد. شغّل ملف 20261120_mas_ai_knowledge.sql في SQL Editor.":/23505/.test(e.code||"")||/duplicate/i.test(e.message||"")?"هذا المصطلح محفوظ بالفعل.":/limit/i.test(e.message||"")?"وصلت للحد الأقصى (100 عنصر). احذف ما لا تحتاجه.":/permission|policy|42501/i.test((e.code||"")+(e.message||""))?"ليس لديك صلاحية تعديل الذاكرة.":"تعذّر الحفظ، حاول مرة أخرى.";
async function memLoad(){const r=await db.from("ai_knowledge").select("id,kind,term,meaning,active").order("id",{ascending:false});if(r.error){memMsg=memErr(r.error);MEM=[]}else{memMsg="";MEM=r.data||[]}}
function memDraw(pre){
  const p=$("x_memp"),e=memEdit?MEM.find(x=>x.id===memEdit):null,v=e||pre||{};
  p.innerHTML='<div class="mh"><b>ذاكرة المساعد ('+MEM.length+')</b><small>ما تحفظه هنا يستخدمه المساعد في كل إجابة لفهم مصطلحات مصنعك وتصحيح أخطائه. لا تكتب فيها أرقامًا أو بيانات سرية، فهي للتسمية والتفسير فقط.</small></div>'+
   (memMsg?'<div class="x-mnote">'+esc(memMsg)+"</div>":"")+
   '<div class="mf"><select id="mm_k" aria-label="النوع">'+Object.keys(KIND_AR).map(k=>'<option value="'+k+'"'+((v.kind||"term")===k?" selected":"")+">"+KIND_AR[k]+"</option>").join("")+'</select><input id="mm_t" maxlength="80" placeholder="المصطلح أو الخطأ الشائع (مثال: البرشر)" value="'+esc(v.term||"")+'"><input id="mm_m" maxlength="300" placeholder="المعنى أو الصواب (مثال: قسم تشطيب قبل الجليز)" value="'+esc(v.meaning||"")+'"><button type="button" class="p" id="mm_s">'+(e?"تحديث":"حفظ")+'</button>'+(e?'<button type="button" id="mm_c">إلغاء</button>':"")+"</div>"+
   '<div class="x-ml">'+(MEM.length?MEM.map(x=>'<div class="x-mi'+(x.active?"":" off")+'"><input type="checkbox" data-ma="'+x.id+'" '+(x.active?"checked":"")+' aria-label="تفعيل"><span class="kd">'+KIND_AR[x.kind]+'</span><div class="tx"><b>'+esc(x.term)+"</b> ← "+esc(x.meaning)+'</div><button type="button" data-me="'+x.id+'" aria-label="تعديل">'+ic("edit")+'</button><button type="button" data-md="'+x.id+'" aria-label="حذف">'+ic("trash")+"</button></div>").join(""):'<div class="x-empty">لا توجد عناصر بعد. أضف أول مصطلح من الأعلى.</div>')+"</div>";
}
async function openMem(pre){const p=$("x_memp");if(!CANMEM())return;p.hidden=false;$("x_admin").hidden=true;memEdit=null;await memLoad();memDraw(pre);setTimeout(()=>$("mm_t")&&$("mm_t").focus(),50)}
$("x_memp").addEventListener("click",async e=>{
  const B=e.target.closest("button"),c=e.target.closest("[data-ma]");
  if(c)return; // يُعالج في change
  if(!B)return;
  if(B.id==="mm_c"){memEdit=null;memDraw();return}
  if(B.dataset.me){memEdit=+B.dataset.me;memDraw();$("mm_t").focus();return}
  if(B.dataset.md){if(!confirm("حذف هذا العنصر من ذاكرة المساعد؟"))return;const r=await db.from("ai_knowledge").delete().eq("id",+B.dataset.md);if(r.error){toast(memErr(r.error),"bad");return}toast("تم الحذف","ok");await memLoad();memDraw();return}
  if(B.id==="mm_s"){
    const row={kind:$("mm_k").value,term:$("mm_t").value.trim(),meaning:$("mm_m").value.trim()};
    if(!row.term||!row.meaning){toast("اكتب المصطلح ومعناه","bad");return}
    B.disabled=true;
    const r=memEdit?await db.from("ai_knowledge").update(row).eq("id",memEdit):await db.from("ai_knowledge").insert(row);
    B.disabled=false;if(r.error){toast(memErr(r.error),"bad");return}
    toast(memEdit?"تم التحديث":"تم الحفظ — سيستخدمه المساعد في الإجابات القادمة","ok");memEdit=null;await memLoad();memDraw();$("mm_t").focus()}
});
$("x_memp").addEventListener("change",async e=>{const c=e.target.closest("[data-ma]");if(!c)return;
  const r=await db.from("ai_knowledge").update({active:c.checked}).eq("id",+c.dataset.ma);
  if(r.error){toast(memErr(r.error),"bad");c.checked=!c.checked;return}await memLoad();memDraw()});
$("x_memp").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("mm_")&&e.target.tagName==="INPUT"){e.preventDefault();$("mm_s").click()}});

const nfmt=v=>Math.round(v).toLocaleString("ar-EG");
function labChart(r){
  const H=r.hist,F=r.fc,all=[...H.map(x=>x.y),...F.map(x=>x.v)],mx=Math.max(...all,1),W=640,Hh=190,pl=8,pb=22,N=H.length+F.length,X=i=>pl+i*(W-2*pl)/(N-1),Y=v=>Hh-pb-v/mx*(Hh-pb-12);
  const pa=H.map((x,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(x.y).toFixed(1)).join(" "),
        pf=[H[H.length-1].y,...F.map(x=>x.v)].map((v,i)=>(i?"L":"M")+X(H.length-1+i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
  return '<svg class="lb-ch" viewBox="0 0 '+W+" "+Hh+'" role="img" aria-label="الإنتاج الفعلي والتوقع"><line x1="'+pl+'" x2="'+(W-pl)+'" y1="'+(Hh-pb)+'" y2="'+(Hh-pb)+'" stroke="currentColor" opacity=".2"/><path d="'+pa+'" fill="none" stroke="#642631" stroke-width="2.2" stroke-linejoin="round"/><path d="'+pf+'" fill="none" stroke="#c9a24b" stroke-width="2.4" stroke-dasharray="6 5" stroke-linejoin="round"/><text x="'+pl+'" y="'+(Hh-6)+'" font-size="12" fill="currentColor" opacity=".7">آخر 42 يومًا فعليًا</text><text x="'+(W-pl)+'" y="'+(Hh-6)+'" font-size="12" text-anchor="end" fill="#a07c2a">توقع 7 أيام</text></svg>';
}
async function labOpen(){
  const p=$("x_labp");if(!p.hidden){p.hidden=true;return}
  $("x_memp").hidden=true;$("x_admin").hidden=true;p.hidden=false;
  p.innerHTML='<div class="mh"><b>مختبر التنبؤ <span class="lb-tag">تجريبي</span></b><small>يدرّب شبكة عصبية صغيرة داخل المتصفح على إنتاجك اليومي خلال آخر سنة، ثم يقارنها على أيام لم تَرَها بطرق إحصائية بسيطة. لا يدخل في إجابات المساعد ولا يغيّر أي بيانات.</small></div><div class="lb-row"><select id="lb_s" aria-label="القسم"><option value="">كل الأقسام</option>'+Object.keys(SECN).map(k=>'<option value="'+k+'">'+SECN[k]+"</option>").join("")+'</select><button type="button" class="p" id="lb_go">ابدأ التجربة</button></div><div id="lb_o"></div>';
  $("lb_go").onclick=async()=>{
    const b=$("lb_go"),o=$("lb_o"),sec=$("lb_s").value;b.disabled=true;o.innerHTML='<div class="lb-sm">جارٍ تحميل البيانات…</div>';
    const to=today(),from=new Date(Date.now()-364*864e5).toISOString().slice(0,10);
    const q=await db.rpc("mas_ai_facts",{p_from:from,p_to:to,p_secs:sec?[sec]:null});
    if(q.error){o.innerHTML='<div class="x-mnote">تعذّر تحميل البيانات أو ليس لديك صلاحية عليها.</div>';b.disabled=false;return}
    const S=mkSeries((q.data&&q.data.daily_production)||[],from,to);
    o.innerHTML='<div class="lb-sm">جارٍ تدريب الشبكة ومقارنتها…</div>';await new Promise(r=>setTimeout(r,60));
    let r;try{r=labRun(S)}catch(e){o.innerHTML='<div class="x-mnote">حدث خطأ أثناء التجربة.</div>';b.disabled=false;return}
    b.disabled=false;
    if(!r.ok){o.innerHTML='<div class="lb-v w">البيانات غير كافية لتجربة موثوقة: عندك '+r.n+' يومًا منها '+r.nz+' يوم إنتاج. أحتاج 90 يومًا على الأقل منها 45 يوم إنتاج. استخدم «كل الأقسام» أو انتظر تراكم بيانات أكثر.</div>';return}
    const best=Math.min(...r.res.map(x=>x.mae)),pct=Math.abs(Math.round(r.imp*100));
    const vt=r.verdict==="g"?"الشبكة العصبية أدق من أفضل طريقة إحصائية بحوالي "+pct+"% على أيام الاختبار، فاعتمدتها في التوقع."
      :r.verdict==="b"?"الطرق الإحصائية أدق من الشبكة العصبية بحوالي "+pct+"%. الأفضل لك الآن «"+LAB_AR[r.win]+"»، وهي أبسط وأوضح."
      :"النتيجتان متقاربتان (فرق أقل من 5%). لا يوجد مبرر لتعقيد الشبكة العصبية الآن، واخترت «"+LAB_AR[r.win]+"» للتوقع.";
    o.innerHTML='<div class="lb-sm">اختُبرت على آخر '+r.H+' يومًا لم تدخل في التدريب، من إجمالي '+r.n+' يومًا ('+r.nz+' يوم إنتاج). الخطأ بالقطعة (أقل = أفضل).</div>'+
      '<div class="tw" style="overflow-x:auto"><table class="lb-t"><thead><tr><th>الطريقة</th><th>الخطأ اليومي</th><th>الخطأ %</th></tr></thead><tbody>'+
      [...r.res].sort((a,b)=>a.mae-b.mae).map(x=>'<tr class="'+(x.k===r.win?"win":"")+'"><td>'+LAB_AR[x.k]+(x.k===r.win?" ✓":"")+"</td><td>"+nfmt(x.mae)+"</td><td>"+(x.wape*100).toFixed(1)+"%</td></tr>").join("")+"</tbody></table></div>"+
      '<div class="lb-v '+(r.verdict==="g"?"g":"w")+'">'+esc(vt)+'</div>'+labChart(r)+
      '<div class="tw"><table class="lb-t"><thead><tr><th>اليوم</th><th>التاريخ</th><th>الإنتاج المتوقع</th></tr></thead><tbody>'+r.fc.map(x=>"<tr><td>"+DAYS_AR[x.w]+"</td><td>"+x.d+"</td><td>"+nfmt(x.v)+"</td></tr>").join("")+"</tbody></table></div>"+
      '<div class="lb-sm">تنبيه: الاختبار على عدد أيام محدود فقد تتغير النتيجة مع بيانات جديدة، والتوقع تقدير وليس وعدًا. الأعياد والتوقفات غير معروفة للنموذج.</div>';
  };
}

  $("ai_go").onclick=()=>{if(busy){stop();return}const v=q.value;if(v.trim().length<2){toast("اكتب سؤالك","bad");return}q.value="";fit();fillMode?(CANWRITE?writeCommand(v.trim()):extractData({text:v.trim()},v.trim().slice(0,60))):askQ(v)};
  addEventListener("online",()=>markOff(false));addEventListener("offline",()=>markOff(true));
})();
