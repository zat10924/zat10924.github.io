<script>
const SEC={
 glaze:{name:"جليز",color:"#2E6F80",o:"glaze_orders",l:"glaze_lines_status",p:"glaze_production",lab:x=>x.color},
 deco:{name:"زخرفة",color:"#5E5A8C",o:"deco_orders",l:"deco_lines_status",p:"deco_production",lab:x=>"كود "+x.code},
 spray:{name:"رش",color:"#B8862B"},
 casting:{name:"الصب اليدوي",color:"#8A5A3C"},brush:{name:"البرشر",color:"#A0522D"},finish:{name:"الفنش",color:"#3E7C6B"}};
// الفنش: تسجيل بالأداء (مشرط/مياه/صنفرة) من غير طلبيات
const FIN_TASKS=["مشرط","مياه","صنفرة"],FIN_TBL="finish_log";
// أقسام الصب والبرشر: نفس النموذج (طلبيات بالكمية + وردية + هالك جودة) بجداول مختلفة
const CAST={casting:{o:"casting_orders",l:"casting_log",d:"casting_date"},brush:{o:"brush_orders",l:"brush_log",d:"brush_date"}};
/* صور أكواد الرسمات (زخرفة) */
let CIMG=new Map(),cimgAt=0;
async function loadCodeImgs(){
  if(CIMG.size&&Date.now()-cimgAt<120000)return;
  try{const r=await db.from("catalog").select("name,image").eq("kind","code").not("image","is",null);
    if(!r.error&&r.data){CIMG=new Map(r.data.map(x=>[norm(x.name),safeAv(x.image)]).filter(x=>x[1]));cimgAt=Date.now()}}catch(e){}
}
const cimg=c=>CIMG.get(norm(c))||"";
const cthumb=c=>{const u=cimg(c);return u?`<span class="dthumb" data-zc="${esc(c)}" style="background-image:url('${u}')" role="button" aria-label="تكبير صورة الرسمة"></span>`:""};
function zoomCode(c){
  const u=cimg(c);if(!u)return;
  const d=document.createElement("div");d.className="ov";d.style.zIndex=60;
  d.innerHTML=`<div class="modal"><h3>كود ${esc(c)}</h3><img class="zoomimg" alt="" src="${u}" style="max-height:70vh"><div class="row"><button class="btn ghost" id="zx" type="button" style="flex:1">إغلاق</button></div></div>`;
  document.body.appendChild(d);d.onclick=e=>{if(e.target===d||e.target.id==="zx")d.remove()};
}
document.addEventListener("click",e=>{const z=e.target.closest("[data-zc]");if(z){e.stopPropagation();zoomCode(z.dataset.zc)}},true);
let multi=false,sel=new Set(),selSec="",sec="",allowed=[],rows=[],tod=[],Q="",stale=0,D="",CO=new Map();

async function load(){
  if(!D)D=today();
  if(sec==="deco")await loadCodeImgs();
  const c=SEC[sec],t=D;
  try{
    if(CAST[sec]){
      const CT=CAST[sec];
      const[o,l,p,g]=await Promise.all([db.from(CT.o).select("*"),
        db.from(CT.l).select("order_id,qty").not("order_id","is",null),
        db.from(CT.l).select("*").eq(CT.d,t).order("id",{ascending:false}),
        db.from("order_groups").select("id,title,order_no")]);
      if(p.error)throw new Error("load");
      const GM=new Map(((g&&g.data)||[]).map(x=>[x.id,x])),dn=new Map();
      (l.data||[]).forEach(r=>dn.set(r.order_id,(dn.get(r.order_id)||0)+(+r.qty||0)));
      CO=new Map();
      (o.error?[]:o.data||[]).forEach(x=>{const gg=GM.get(x.group_id);CO.set(x.id,{id:x.id,item:x.item,req:+x.qty_required||0,done:dn.get(x.id)||0,st:x.status,date:x.order_date,due:x.due_date,
        sub:gg?((gg.order_no?"#"+gg.order_no+" · ":"")+((gg.title||"").trim()||"طلبية")):"طلبية #"+x.id})});
      rows=[...CO.values()].filter(x=>x.st==="open"&&x.req-x.done>0).map(x=>({id:x.id,oid:x.id,title:x.item,sub:x.sub,req:x.req,done:x.done,date:x.date,due:x.due}));
      tod=(p.data||[]).map(e=>({k:"cast",tb:CT.l,id:e.id,qty:e.qty,date:e[CT.d],by:e.created_by||null,worker:e.worker||"",note:e.note||"",item:e.item||"",sh:e.shift||"",scrap:e.scrap||0,mo:e.molds==null?null:+e.molds,po:e.pours==null?null:+e.pours,oid:e.order_id||null,isw:!(+e.qty>0)&&+e.scrap>0,
        txt:(!(+e.qty>0)&&+e.scrap>0?"هالك جودة · ":"")+(e.item||"—")+(e.shift?" · "+e.shift:"")+(+e.qty>0&&e.scrap?" · هالك "+e.scrap:"")+(!(+e.qty>0)&&+e.scrap>0?"":(e.order_id?"":" · بدون طلبية"))}));
    }else if(sec==="finish"){
      const p=await db.from(FIN_TBL).select("*").eq("finish_date",t).order("id",{ascending:false});
      if(p.error)throw new Error(/finish_log|relation|schema cache|does not exist/i.test(p.error.message||"")?"nofinish":"load");
      tod=(p.data||[]).map(e=>({k:"fin",tb:FIN_TBL,id:e.id,qty:+e.qty||0,date:e.finish_date,by:e.created_by||null,worker:e.worker||"",note:e.note||"",task:e.task||"",sh:e.shift||"",scrap:+e.scrap||0,isw:!(+e.qty>0)&&+e.scrap>0,
        txt:(!(+e.qty>0)&&+e.scrap>0?"هالك جودة · ":"")+(e.task||"—")+(e.shift?" · "+e.shift:"")+(+e.qty>0&&e.scrap?" · هالك "+e.scrap:"")}));
      rows=FIN_TASKS.map(k=>({id:k,oid:null,title:k,sub:"أداء",req:0,done:tod.filter(e=>e.task===k&&!e.isw).reduce((a,e)=>a+e.qty,0),sc:tod.filter(e=>e.task===k).reduce((a,e)=>a+e.scrap,0),date:t}));
    }else if(c.o){
      const[o,l,p]=await Promise.all([db.from(c.o).select("*"),db.from(c.l).select("*").order("id"),
        db.from(c.p).select("*").eq("prod_date",t).order("id",{ascending:false})]);
      if(o.error||l.error)throw new Error("load");
      const om=new Map(o.data.map(x=>[x.id,x])),lm=new Map(l.data.map(x=>[x.id,x]));
      rows=l.data.filter(x=>om.get(x.order_id)?.status==="open").map(x=>({id:x.id,oid:x.order_id,title:om.get(x.order_id).item,sub:c.lab(x),code:x.code,req:x.total_required,done:x.produced,date:om.get(x.order_id).order_date,due:om.get(x.order_id).due_date}));
      tod=(p.data||[]).map(e=>{const x=lm.get(e.line_id),o2=x&&om.get(x.order_id);return{k:"line",tb:c.p,id:e.id,qty:e.qty,date:e.prod_date,by:e.created_by||null,worker:e.worker||"",note:e.note||"",design:e.design||"",txt:o2?o2.item+" · "+c.lab(x):"—",max:x?x.total_required-x.produced+e.qty:0,sync:x?{lv:c.l,o:c.o,oid:x.order_id}:null}});
    }else{
      const[o,p,sco]=await Promise.all([db.from("spray_status").select("*"),db.from("spray_production").select("*").eq("prod_date",t).order("id",{ascending:false}),db.from("spray_orders").select("id,spray_color")]);
      if(o.error)throw new Error("load");
      const scm=new Map((sco.data||[]).map(x=>[x.id,(x.spray_color||"").trim()])); // لون الرش المطلوب على الطلبية (الـ view ممكن ما يحمّلوش)
      const om=new Map(o.data.map(x=>[x.id,x]));
      rows=o.data.filter(x=>x.status==="open").map(x=>({id:x.id,oid:x.id,title:x.item,sub:x.color,req:x.qty_required,done:x.produced,date:x.order_date,tsc:scm.get(x.id)||x.spray_color||""}));
      tod=(p.data||[]).map(e=>{const x=om.get(e.order_id),sc=e.spray_color||"";return{k:"line",tb:"spray_production",id:e.id,qty:e.qty,date:e.prod_date,by:e.created_by||null,worker:e.worker||"",note:e.note||"",design:"",sc,txt:x?x.item+" · "+x.color+(sc?" · لون الرش: "+sc:""):"—",max:x?x.qty_required-x.produced+e.qty:0,sync:x?{sv:"spray_status",o:"spray_orders",oid:x.id}:null}});
    }
    // الإنتاج بدون طلبية (لو الجدول موجود)
    if(!CAST[sec]&&sec!=="finish")try{
      const f=await db.from("free_production").select("*").eq("section",sec).eq("prod_date",t).order("id",{ascending:false});
      if(!f.error)tod.unshift(...(f.data||[]).map(e=>({k:"free",tb:"free_production",id:e.id,qty:e.qty,date:e.prod_date,by:e.created_by||null,item:e.item,sub:e.sub||"",sc:e.spray_color||"",worker:e.worker||"",note:e.note||"",design:e.design||"",txt:e.item+(e.sub?" · "+e.sub:"")+(e.spray_color?" · لون الرش: "+e.spray_color:"")+" · بدون طلبية"})));
    }catch(e){}
    // سجل الهالك (جليز)
    if(sec==="glaze"){
      try{
        const w=await db.from("glaze_waste").select("*").gte("waste_date",t).lte("waste_date",t+"T23:59:59").order("id",{ascending:false});
        if(!w.error)tod.push(...(w.data||[]).map(e=>({k:"waste",tb:"glaze_waste",id:e.id,qty:+e.qty||0,good:+e.good_qty||0,date:String(e.waste_date||"").slice(0,10),by:e.created_by||null,item:e.item||"",reason:e.reason||"",worker:"",txt:"هالك · "+(e.item||"—")+" · سليم "+(+e.good_qty||0)+(e.reason?" · "+e.reason:"")})));
      }catch(x){}
    }
    try{localStorage.setItem("pc_"+sec,JSON.stringify({rows,tod,at:Date.now()}))}catch(e){}
    stale=0;
  }catch(e){
    let ch=null;try{ch=JSON.parse(localStorage.getItem("pc_"+sec))}catch(x){}
    if(e&&e.message==="nofinish"){document.getElementById("list").innerHTML='<div class="empty err-state">جدول الفنش غير موجود. شغّل ملف setup_finish.sql من Supabase (SQL Editor) مرة واحدة.</div>';return}
    if(!ch){fail("list",load);return}
    rows=ch.rows;tod=D===today()?ch.tod:[];stale=ch.at;
  }
  // التسجيلات اللي لسه ما اتبعتتش بتتحسب في الأرقام
  Q_.get().filter(i=>i.sec===sec).forEach(i=>{const r=rows.find(x=>x.id===i.rid);if(r&&sec!=="finish")r.done+=i.qty;if((i.row&&(i.row.prod_date||i.row.casting_date||i.row.brush_date||i.row.finish_date)||today())===D)tod.unshift({qty:i.qty,txt:i.txt+" ⏳",pend:1})});
  draw();
}
function drawFin(){
  const q=Q.trim().toLowerCase(),prod=tod.filter(e=>!e.isw).reduce((a,e)=>a+e.qty,0),scr=tod.reduce((a,e)=>a+e.scrap,0);
  kpis("stats",[[D===today()?"إنتاج النهارده":"إنتاج اليوم",prod,"var(--ok)"],["هالك الجودة",scr,scr?"var(--bad,#b3261e)":""],["عدد التسجيلات",tod.filter(e=>!e.pend).length]]);
  const list=rows.filter(r=>!q||r.title.toLowerCase().includes(q));
  document.getElementById("list").innerHTML=list.map(r=>`<div class="card pr" data-id="${esc(r.id)}" style="cursor:pointer"><div class="top"><b>${esc(r.title)}</b><span class="tag">اضغط للتسجيل</span></div><div class="nums">النهارده: <b>${nf(r.done)}</b> قطعة${r.sc?` · هالك <b style="color:var(--bad,#b3261e)">${nf(r.sc)}</b>`:""}</div></div>`).join("");
}
function draw(){
  const c=SEC[sec],q=Q.trim().toLowerCase();
  if(selSec!==sec){sel.clear();selSec=sec}
  const list=rows.filter(r=>!q||(r.title+" "+r.sub).toLowerCase().includes(q)).sort((a,b)=>String(a.due||a.date).localeCompare(String(b.due||b.date)));
  if(sec!=="finish")kpis("stats",[["بنود مفتوحة",rows.length],["المتبقي",rows.reduce((a,r)=>a+Math.max(r.req-r.done,0),0)],[D===today()?"إنتاج النهارده":"إنتاج اليوم",tod.filter(e=>e.k!=="waste").reduce((a,e)=>a+e.qty,0),"var(--ok)"]]);
  if(sec==="finish")drawFin();else
  document.getElementById("list").innerHTML=list.length?list.map(r=>{
    const rem=Math.max(r.req-r.done,0),p=r.req>0?Math.min(100,Math.round(r.done/r.req*100)):0,late=r.due?today()>r.due:isLate("open",r.date);
    return `<div class="card pr ${multi&&sel.has(r.id)?"sel":""}" data-id="${r.id}" style="cursor:pointer"><div class="top"><span style="display:flex;gap:8px;align-items:center;min-width:0">${multi?`<span class="ck ${sel.has(r.id)?"on":""}"></span>`:""}${sec==="deco"?cthumb(r.code):""}<b>${esc(r.title)}</b></span><span>${late?'<span class="tag late">متأخرة</span> ':""}<span class="tag">${esc(r.sub)}</span></span></div>
      <div class="bar"><i style="width:${p}%"></i></div><div class="nums">تم <b>${nf(r.done)}</b> من <b>${nf(r.req)}</b> · متبقي <b>${nf(rem)}</b></div>${r.tsc?`<div class="nums">لون الرش المطلوب: <b>${esc(r.tsc)}</b></div>`:""}</div>`}).join(""):`<div class="empty">${q?"مفيش نتائج":"مفيش بنود مفتوحة"}</div>`;
  document.querySelectorAll(".pr").forEach(e=>e.onclick=()=>pickRow(rows.find(r=>String(r.id)===e.dataset.id),e));
  updBar();
  wasteBtn.hidden=sec!=="glaze"&&!CAST[sec]&&sec!=="finish";mbtn.parentElement.hidden=!!CAST[sec]||sec==="finish";freeBtn.textContent=sec==="finish"?"＋ تسجيل إنتاج":"＋ إنتاج بدون طلبية";pbar();
  if(stale)document.getElementById("list").insertAdjacentHTML("afterbegin",`<div class="card" style="border-color:var(--warn)"><b class="ibt">${ui("wifioff")}لا يوجد اتصال</b><div class="nums">بيانات محفوظة من آخر اتصال (${new Date(stale).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"})}). تسجيلاتك هتتحفظ وتتبعت لما النت يرجع.</div></div>`);
  const ce=!stale,cd=can("delete")&&!stale,lockedNote=!stale&&!can("edit")&&can("editown")&&dayClosed(D);
  document.getElementById("logh").textContent=D===today()?"تسجيلات النهارده":"تسجيلات يوم "+fmtD(D);
  document.getElementById("logd").value=D;
  document.getElementById("today").innerHTML=(lockedNote&&tod.length?`<div class="hint" style="margin:0 0 8px">التعديل مقفول — اليوم ده خلص. تقدر تعدّل تسجيلاتك في نفس يوم التسجيل بس.</div>`:"")+(tod.length?`<div class="card">${tod.map((e,i)=>`<div class="line fe"><span>${esc(e.txt)}${e.worker?` <span class="nums">· ${esc(e.worker)}</span>`:""}</span><span style="display:flex;align-items:center;gap:6px"><b${(e.k==="waste"||e.isw)?' style="color:var(--bad,#c0392b)"':""}>${nf(e.isw?e.scrap:e.qty)}</b>${e.k&&!e.pend&&ce&&canEditEntry(e)?`<button class="btn ghost sm" type="button" onclick="editEnt(${i})">تعديل</button>`:""}${e.k&&!e.pend&&cd?`<button class="btn ghost sm" type="button" onclick="delEntry(${i})">حذف</button>`:""}</span></div>`).join("")}</div>`:`<div class="empty">${D===today()?"لسه مفيش تسجيل النهارده":"مفيش تسجيل في اليوم ده"}</div>`);
}

/* الشريط السفلي: اليوم | ➕ إنتاج بدون طلبية | هالك */
const _S=h=>`<svg viewBox="0 0 24 24" aria-hidden="true">${h}</svg>`;
function pbar(){

async function saveOne(r,q,d,sc){
  const c=SEC[sec],id=uuid(),tb=c.p||"spray_production";
  const row=c.p?{line_id:r.id,qty:q,prod_date:d,client_id:id}:{order_id:r.id,qty:q,prod_date:d,client_id:id,spray_color:sc};
  const it={id,table:tb,row,sec,rid:r.id,qty:q,txt:r.title+" · "+r.sub,sync:c.o?{lv:c.l,o:c.o,oid:r.oid}:{sv:"spray_status",o:"spray_orders",oid:r.id}};
  let res;try{res=await insertRow(tb,row)}catch(e){res={error:{message:String(e)}}}
  if(res.error&&isNet(res.error)){Q_.add(it);updateBadge();return{off:1}}

async function resync(e){
  const x=e.sync;if(!x)return;
  if(x.lv){await syncAfter(e);return}
  const{data}=await db.from(x.sv).select("*").eq("id",x.oid).single();
  const done=!!data&&data.produced>=data.qty_required;
  if(data&&data.status!==(done?"done":"open"))await db.from(x.o).update({status:done?"done":"open"}).eq("id",x.oid);
}

        if(!e.qty&&!e.item&&!e.oid)continue;
        const it2=free?e.item:((CO.get(e.oid)||{}).item||"");
        if(e.qty<1||!it2||(!free&&!e.oid)){toast("كمّل بيانات الأصناف الإضافية (الصنف أو الطلبية وعدد القطع)");return false}
        extra.push({oid:free?null:e.oid,item:it2,qty:e.qty,molds:e.molds,pours:e.pours});
      }
    }
    const cd=lockDate?(rec?rec.date:today()):(document.getElementById("m-d").value||today());
    const brx=(!waste&&sec==="brush"&&!rec)?(()=>{const b=brcRead(),o={};if(b.molds!=null)o.molds=b.molds;if(b.pours!=null)o.pours=b.pours;return o})():{},exb=e=>{const o={};if(e.molds!=null)o.molds=e.molds;if(e.pours!=null)o.pours=e.pours;return o};
    const ents=!rec?(auto?castAutoSplit([{item,qty:q,...brx},...extra.map(e=>({item:e.item,qty:e.qty,...exb(e)}))],castOpen()):[{item,qty:q,order_id:oid,...brx},...extra.map(e=>({item:e.item,qty:e.qty,order_id:e.oid,...exb(e)}))]):null;
    const used=new Map();
    if(!await reviewSave({title:waste?"راجع الهالك قبل الحفظ":"راجع الإنتاج قبل الحفظ",meta:[["التاريخ",fmtD(cd)],["الوردية",sh],...rvFields(x)],
      items:(ents||[{item,qty:waste?sc:q,order_id:oid}]).map(e=>{const o=e.order_id?CO.get(e.order_id):null;
        const rows=[[waste?"عدد القطع الهالكة":"عدد القطع",nf(waste?sc:e.qty)],["الطلبية",o?cLab(o):"بدون طلبية"]];let warn="";
        if(o){const base=Math.max(o.req-o.done-pendQ(o.id),0)+(rec&&rec.oid===o.id?rec.qty:0),u=(used.get(o.id)||0)+e.qty;used.set(o.id,u);rows.push(["المتبقي بعد التسجيل",remAfter(base,u)]);warn=overWarn(base,u)}
        return{title:e.item,rows,warn}})}))return false;
    const row={[CAST[sec].d]:cd,item,qty:q,scrap:sc,shift:sh,worker:x.worker||null,note:x.note||null,order_id:oid};
    if(sec==="brush"&&!waste&&rec){const b=brcRead();if(b.molds!=null||b.pours!=null||(rec&&(rec.mo!=null||rec.po!=null))){row.molds=b.molds;row.pours=b.pours}}
    if(!se&&rec)delete row.scrap; // نموذج الإنتاج ما بيلمسش الهالك
    if(!rec){
      const linked=ents.filter(e=>e.order_id).length;
      let ok=0,qd=0,err=null;
      let ix=0;for(const en of ents){const r1={...row,...en};ix++;const rr=await castInsert(r1,CAST[sec].l,sec);if(rr.queued)qd++;else if(rr.error){err=rr.error;break}else ok++}
      try{localStorage.setItem("cast_shift",sh)}catch(e){}if(!waste&&!rec)smartSave(sec,{w:x.worker,i:item,q:q});
      if(err){
        const m=BRC_ERR.test(err.message||"")?"شغّل ملف setup_v4_4.sql من Supabase الأول":/shift|scrap|order_id/.test(err.message||"")?"شغّل ملف "+castSql()+" من Supabase الأول":"خطأ: "+err.message;
        if(!ok&&!qd){toast(m,"bad");return false}
        await load();toast("اتسجّل "+(ok+qd)+" من "+ents.length+" أصناف — "+m,"bad");return;
      }
      await load();
      toast(qd?"مفيش نت: اتحفظ على الجهاز وهيتسجل لوحده لما النت يرجع":(auto?(linked?"تم التسجيل وربطه تلقائيًا بالطلبية":"تم التسجيل (مفيش طلبية مفتوحة للصنف ده)"):(ok>1?"تم تسجيل "+ok+" أصناف":"تم التسجيل")),qd?"warn":undefined);return;
    }
    let r=rec?await db.from(CAST[sec].l).update(row).eq("id",rec.id).select():await castInsert(row,CAST[sec].l,sec);
    if(r.queued){try{localStorage.setItem("cast_shift",sh)}catch(e){}if(!waste&&!rec)smartSave(sec,{w:x.worker,i:item,q:q});await load();toast("مفيش نت: اتحفظ على الجهاز وهيتسجل لوحده لما النت يرجع","warn");return}
    if(r.error){toast(isNet(r.error)?"التعديل محتاج اتصال بالإنترنت":(BRC_ERR.test(r.error.message||"")?"شغّل ملف setup_v4_4.sql من Supabase الأول":/shift|scrap|order_id/.test(r.error.message||"")?"شغّل ملف "+castSql()+" من Supabase الأول":"خطأ: "+r.error.message),"bad");return false}
    if(rec&&(!r.data||!r.data.length)){toast("لم يتم التعديل، راجع الصلاحيات","bad");return false}
    try{localStorage.setItem("cast_shift",sh)}catch(e){}if(!waste&&!rec)smartSave(sec,{w:x.worker,i:item,q:q});
    await load();toast(rec?"تم التعديل":"تم التسجيل");
  });
  setTimeout(()=>{
    const w=document.getElementById("m-w");if(w&&rec)w.value=rec.worker;
    if(sec==="brush"&&!waste)brcWire(rec);
    if(!waste)smartFill(sec,rec);
    if(waste){ // سليم العامل وهالكه ونسبة الهالك في اليوم المعروض
      const h=document.getElementById("m-wh"),dEl=document.getElementById("m-d"),sEl=document.getElementById("m-scrap");
      const upd=()=>{const n=w.value.trim();if(!n||dEl.value!==D){h.textContent=n&&dEl.value!==D?"النسبة بتظهر لليوم المعروض بس":"";return}
        const mine=tod.filter(e=>e.k==="cast"&&e.worker===n&&(!rec||e.id!==rec.id)),g=mine.reduce((a,e)=>a+(+e.qty||0),0),s=mine.reduce((a,e)=>a+(+e.scrap||0),0)+(parseInt(sEl.value)||0);
        h.textContent="سليم "+n+" في اليوم: "+nf(g)+" · هالك: "+nf(s)+" · نسبة الهالك: "+(g+s?Math.round(s/(g+s)*1000)/10:0)+"%"};
      ["input","change","blur"].forEach(ev=>[w,dEl,sEl].forEach(el=>el.addEventListener(ev,upd)));upd();
    }
    const mode=document.getElementById("m-mode");if(!mode)return;
    mx=(!waste&&!rec)?CM.wire(ords.map(o=>`<option value="${o.id}">${esc(cLab(o))}</option>`).join(""),()=>mode.value==="order"?"order":"free",sec==="brush"?(id=>(CO.get(id)||{}).item):undefined):null;
    const sel=document.getElementById("m-o"),item=document.getElementById("m-item"),hint=document.getElementById("m-hint");
    const sync=()=>{
      const on=mode.value==="order";document.getElementById("m-ow").style.display=on?"block":"none";
      const o=on?CO.get(parseInt(sel.value)):null;item.readOnly=!!o;
      if(o){item.value=o.item;hint.textContent="مطلوب "+nf(o.req)+" · اتعمل "+nf(o.done)+" · متبقي "+nf(Math.max(o.req-o.done,0))}else hint.textContent="";
      const ah=document.getElementById("m-ah");
      if(ah){ // معاينة الربط التلقائي
        if(mode.value!=="auto")ah.textContent="";
        else{const it=item.value.trim();
          if(!it)ah.textContent="اكتب الصنف وهيتربط لوحده بالطلبيات المفتوحة لنفس الصنف";
          else{const qv=parseInt((document.getElementById("m-q")||{}).value)||1,sp=castAutoSplit([{item:it,qty:qv}],castOpen()).filter(e=>e.order_id);
            ah.textContent=sp.length?"هيتربط بـ: "+sp.map(e=>cLab(CO.get(e.order_id))).join(" + "):"مفيش طلبية مفتوحة للصنف ده — هيتسجل بدون طلبية"}}
      }
      if(mx)mx.mode();
    };
    item.addEventListener("input",sync);const qIn=document.getElementById("m-q");if(qIn)qIn.addEventListener("input",sync);
    mode.onchange=sync;sel.onchange=sync;sync();
  },0);
}
/* ===== الفنش: تسجيل بالأداء (مشرط · مياه · صنفرة) + وردية + هالك جودة ===== */
async function finInsert(row){
  const id=uuid(),r2={...row,client_id:id};
  let res;try{res=await insertRow(FIN_TBL,r2)}catch(e){res={error:{message:String(e)}}}
  if(res.error&&isNet(res.error)){
    Q_.add({id,table:FIN_TBL,row:r2,sec:"finish",rid:"free",qty:row.qty,txt:(row.task||"—")+(row.shift?" · "+row.shift:"")+(row.scrap?" · هالك "+row.scrap:"")});
    updateBadge();return{queued:true};
  }
  return res;
}
function finForm(rec,waste,presetTask){if(roBlock())return;

  wkLoad();
  openModal(waste?(rec?"تعديل هالك جودة · ":"تسجيل هالك جودة · ")+"الفنش":(rec?"تعديل تسجيل ":"تسجيل ")+"الفنش",`
    <label>التاريخ</label><input type="date" id="m-d" value="${rec?rec.date:today()}" ${lockDate?"disabled":""}>
    <label>الوردية</label><select id="m-sh">${SHIFTS.map(x=>`<option ${x===shDef?"selected":""}>${x}</option>`).join("")}</select>
    ${XW(true)}
    <label>الأداء</label><select id="m-item"><option value="">— اختار الأداء —</option>${FIN_TASKS.map(t=>`<option ${t===taskDef?"selected":""}>${t}</option>`).join("")}</select>
    ${waste?`<label>عدد القطع الهالكة</label><input type="number" id="m-scrap" min="1" max="100000" inputmode="numeric" value="${rec&&rec.scrap?rec.scrap:""}">`
      :`<label>عدد القطع</label><input type="number" id="m-q" min="${legacySc?0:1}" max="100000" inputmode="numeric" value="${rec?rec.qty:""}">${legacySc?`<label>هالك الجودة (تسجيل قديم)</label><input type="number" id="m-scrap" min="0" max="100000" inputmode="numeric" value="${rec.scrap}">`:""}`}
    <label>${waste?"السبب / ملاحظات (اختياري)":"ملاحظات (اختياري)"}</label><input id="m-n" maxlength="300" placeholder="أي تعليق على الشغل" value="${rec?esc(rec.note):""}">`,async()=>{

    if(!await reviewSave({title:waste?"راجع الهالك قبل الحفظ":"راجع الإنتاج قبل الحفظ",meta:[["التاريخ",fmtD(cd)],["الوردية",sh],...rvFields(x)],
      items:[{title:task,rows:[[waste?"عدد القطع الهالكة":"عدد القطع",nf(waste?sc:q)]]}]}))return false;
    const row={finish_date:cd,task,qty:q,scrap:sc,shift:sh,worker:x.worker||null,note:x.note||null};
    if(!se&&rec)delete row.scrap;
    const res=rec?await db.from(FIN_TBL).update(row).eq("id",rec.id).select():await finInsert(row);
    if(res.queued){try{localStorage.setItem("fin_shift",sh)}catch(e){}if(!waste&&!rec)smartSave("finish",{w:x.worker,i:task,q:q});await load();toast("مفيش نت: اتحفظ على الجهاز وهيتسجل لوحده لما النت يرجع","warn");return}
    if(res.error){toast(/finish_log|schema cache/i.test(res.error.message||"")?"شغّل ملف setup_finish.sql من Supabase الأول":isNet(res.error)?"التعديل محتاج اتصال بالإنترنت":"خطأ: "+res.error.message,"bad");return false}
    if(rec&&(!res.data||!res.data.length)){toast("لم يتم التعديل، راجع الصلاحيات","bad");return false}
