<script>
let rows=[],stock=[],Q="",repCtl=null,tab=location.hash==="#reports"?"prod":location.hash==="#stock"?"stock":"log",stockOk=true;
const NONE="بدون صنف";

async function load(){
  const{data,error}=await db.from("repair_log").select("*").order("repair_date",{ascending:false}).order("id",{ascending:false});
  if(error){fail("body",load);return}
  rows=data.map(r=>({id:r.id,d:r.repair_date,item:r.item||"",color:r.color||"",qty:r.qty,w:r.worker||""}));
  const s=document.getElementById("f-item"),cur=s.value;
  s.innerHTML='<option value="">الكل</option><option value="__none">'+NONE+'</option>'+[...new Set(rows.map(r=>r.item).filter(Boolean))].map(v=>`<option>${esc(v)}</option>`).join("");
  s.value=cur;draw();drawStats();
  await loadStock();
}
/* ===== جرد التصليح: المتبقي = (اللي دخل التصليح) − (اللي اتسجّل تصليح لنفس الصنف من أول تاريخ جرد له) ===== */
async function loadStock(){
  const{data,error}=await db.from("repair_stock").select("*").order("stock_date",{ascending:false}).order("id",{ascending:false});
  if(error){stockOk=false;stock=[];drawStock();return}
  stockOk=true;
  stock=data.map(r=>({id:r.id,d:r.stock_date,item:r.item,color:r.color||"",qty:r.qty,kind:r.kind,note:r.note||""}));
  drawStock();
}
const bk=(i,c)=>norm(i)+"|"+norm(c);
function balances(){
  const m=new Map();
  stock.forEach(r=>{const k=bk(r.item,r.color);let o=m.get(k);if(!o){o={name:r.item,color:r.color,first:r.d,inn:0,rep:0,counted:true};m.set(k,o)}o.inn+=r.qty;if(r.d<o.first)o.first=r.d});
  const extra=new Map();
  rows.forEach(r=>{if(!r.item)return;const k=bk(r.item,r.color),o=m.get(k);
    if(o){if(r.d>=o.first)o.rep+=r.qty}
    else{let e=extra.get(k);if(!e){e={name:r.item,color:r.color,first:"",inn:0,rep:0,counted:false};extra.set(k,e)}e.rep+=r.qty}});
  const list=[...m.values()].map(o=>({...o,left:o.inn-o.rep})).sort((a,b)=>a.left-b.left||a.name.localeCompare(b.name,"ar"));
  return{list,extra:[...extra.values()]};
}
function leftOf(item,color){if(!item)return null;const k=bk(item,color),o=balances().list.find(x=>bk(x.name,x.color)===k);return o?o.left:null}
function drawStock(){
  const body=document.getElementById("stBody");if(!body)return;
  if(!stockOk){body.innerHTML='<tr><td colspan="4" class="empty">شغّل ملف setup_repair_stock.sql في Supabase الأول</td></tr>';document.getElementById("mvBody").innerHTML="";document.getElementById("stStats").innerHTML="";return}
  const{list,extra}=balances();
  const tot=list.reduce((a,o)=>a+Math.max(o.left,0),0),done=list.reduce((a,o)=>a+o.rep,0);
  const lowV=LOW(),nlow=lowV>0?list.filter(o=>o.left>0&&o.left<=lowV).length:0,nout=list.filter(o=>o.left<=0).length;
  kpis("stStats",[["المتبقي للتصليح",tot,"var(--pri)"],["اتصلّح من الجرد",done,"var(--ok)"],["قربت تخلص / خلصت",nlow+nout,nlow+nout?"var(--warn)":undefined]]);
  const neg=list.filter(o=>o.left<0).length;
  document.getElementById("stNote").textContent=neg?"تنبيه: "+neg+" صنف تصليحه أكبر مما دخل الجرد — راجع الكميات أو اعمل تسوية.":"";
  const row=o=>`<tr><td>${esc(o.name)}${o.color?' <span class="nums">· '+esc(o.color)+'</span>':""}</td><td>${o.counted?nf(o.inn):"—"}</td><td>${nf(o.rep)}</td><td><b style="color:${!o.counted?"var(--mute)":o.left<0?"var(--bad)":o.left===0?"var(--mute)":(LOW()>0&&o.left<=LOW())?"var(--warn)":"var(--ok)"}">${o.counted?nf(o.left):"غير مجرود"}</b></td></tr>`;
  body.innerHTML=list.length||extra.length?list.map(row).join("")+extra.map(row).join(""):'<tr><td colspan="4" class="empty">لسه مفيش جرد — اضغط «إضافة للتصليح»</td></tr>';
  document.getElementById("mvBody").innerHTML=stock.length?stock.map(r=>`<tr><td>${fmtD(r.d)}</td><td>${esc(r.item)}${r.color?' <span class="nums">· '+esc(r.color)+'</span>':""}${r.note?'<div class="nums">'+esc(r.note)+'</div>':""}</td><td><b>${r.qty>0?"+":""}${nf(r.qty)}</b></td><td>${r.kind==="adjust"?"تسوية":"دخل التصليح"}</td><td class="noprint" style="white-space:nowrap"><button class="btn ghost sm" onclick="stForm(${r.id})">تعديل</button> <button class="btn ghost sm" onclick="stDel(${r.id})">حذف</button></td></tr>`).join(""):'<tr><td colspan="5" class="empty">مفيش حركات</td></tr>';
}
const LOW=()=>{try{return parseInt(localStorage.getItem("repair_low"))||0}catch(e){return 0}};
function stCsv(){
  const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"',{list,extra}=balances();
  const csv="\uFEFF"+["الصنف,اللون,دخل التصليح,اتصلّح,المتبقي",...list.map(o=>[o.name,o.color,o.inn,o.rep,o.left].map(q).join(",")),...extra.map(o=>[o.name,o.color,"غير مجرود",o.rep,""].map(q).join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="جرد-التصليح.csv";a.click();
}
/* استيراد: الصق من Excel أو اختر ملف CSV — كل سطر: الصنف ثم اللون (اختياري) ثم الكمية */
function stImport(){if(roBlock())return;
  openModal("استيراد جرد التصليح",`<div class="hint" style="margin:0 0 8px">الصق من Excel: كل سطر «الصنف ، اللون (اختياري) ، الكمية». أو اختر ملف CSV.</div>
    <input type="file" id="i-file" accept=".csv,.txt,text/csv,text/plain" style="margin-bottom:8px">
    <textarea id="i-txt" rows="8" style="width:100%"></textarea>
    <label>التاريخ</label><input type="date" id="i-d" value="${today()}">`,async()=>{
    const lines=document.getElementById("i-txt").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean),out=[],badL=[];
    lines.forEach((l,n)=>{
      const p=l.split(/\t|,|،|;/).map(x=>x.trim().replace(/^"|"$/g,""));
      const last=String(p[p.length-1]).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)),num=parseInt(last);
      if(p.length<2||!(num>0)||!p[0]){if(n===0&&p.length>=2&&isNaN(num))return;badL.push(n+1);return}
      out.push({item:p[0],color:p.length>2?p[1]:"",qty:num});
    });
    if(!out.length){toast("مفيش سطور صالحة"+(badL.length?" (راجع السطر "+badL[0]+")":""));return false}
    if(badL.length&&!await ask("فيه "+badL.length+" سطر مش مفهوم (أولهم السطر "+badL[0]+") وهيتخطّوا. تكمّل؟","نعم، كمّل"))return false;
    const d=document.getElementById("i-d").value||today();
    if(!await reviewSave({title:"راجع الاستيراد قبل الحفظ",meta:[["التاريخ",fmtD(d)],["عدد الأصناف",nf(out.length)]],items:out.slice(0,30).map(r=>({title:r.item,rows:[...(r.color?[["اللون",r.color]]:[]),["الكمية",nf(r.qty)]]})),total:out.reduce((a,r)=>a+r.qty,0)}))return false;
    const{error}=await db.from("repair_stock").insert(out.map(r=>({stock_date:d,item:r.item,color:r.color||null,qty:r.qty,kind:"in",client_id:crypto.randomUUID?crypto.randomUUID():null})));
    if(error){toast(/color/.test(error.message||"")?"شغّل ملف setup_repair_color.sql في Supabase الأول":"خطأ: "+error.message);return false}
    await loadStock();toast("تم استيراد "+out.length+" صنف");
  },"استيراد");
  const f=document.getElementById("i-file");
  if(f)f.onchange=async()=>{const t=f.files[0];if(t)document.getElementById("i-txt").value=await t.text()};
}
function stItems(){return[...new Set([...stock.map(r=>r.item),...rows.map(r=>r.item)].filter(Boolean))]}
/* إضافة/تسوية جرد: أكتر من صنف ولون في مرة واحدة (التعديل لحركة واحدة بيفضل في stForm) */
function stMulti(adj){if(roBlock())return;
  const items=stItems();
  const rowHtml=()=>`<div class="itemblk mrow"><div class="ih"><b class="mn"></b><span><button type="button" class="btn ghost sm rmc" style="margin-inline-end:6px">＋ لون آخر لنفس الصنف</button><button type="button" class="rmi" aria-label="حذف الصنف">حذف</button></span></div>
    <label>الصنف</label><input class="it" list="s-items" placeholder="اسم الصنف" autocomplete="off">
    <div class="two"><div><label>اللون (اختياري)</label><input class="sb" data-kind="color" placeholder="اللون" autocomplete="off" maxlength="80"></div>
    <div><label>${adj?"الكمية الفعلية الآن":"الكمية"}</label><input type="number" class="mq2" ${adj?'min="0"':'min="1"'} inputmode="numeric"></div></div><div class="nums sc" style="margin:2px 0 4px"></div></div>`;
  openModal(adj?"تسوية جرد":"إضافة للتصليح",`<label>التاريخ</label><input type="date" id="s-d" value="${today()}">
    <div class="hint" style="margin:6px 0">${adj?"اكتب الموجود فعلًا لكل صنف ولون، والفرق عن المتبقي الحالي هو اللي هيتسجّل.":"سجّل أكتر من صنف أو لون في مرة واحدة."}</div>
    <datalist id="s-items">${items.map(i=>`<option value="${esc(i)}">`).join("")}</datalist>
    <div id="srows"></div>
    <button type="button" class="btn ghost sm" id="sadd" style="margin:6px 0 10px">＋ إضافة صنف آخر</button>
    <label>ملاحظة (اختياري، لكل السطور)</label><input id="s-n" maxlength="300">`,async()=>{
    const els=[...document.getElementById("srows").querySelectorAll(".mrow")],todo=[];
    for(let i=0;i<els.length;i++){
      const el=els[i],item=el.querySelector(".it").value.trim(),color=el.querySelector(".sb").value.trim(),qv=el.querySelector(".mq2").value.trim();
      if(!item&&!color&&!qv)continue;
      if(!item){toast("اكتب اسم الصنف رقم "+(i+1));return false}
      let q=parseInt(qv);
      if(isNaN(q)||(!adj&&q<1)||(adj&&q<0)){toast("اكتب كمية صحيحة للصنف: "+item+(color?" · "+color:""));return false}
      todo.push({item,color,q,actual:q});
    }
    if(!todo.length){toast("اكتب صنف واحد على الأقل");return false}
    if(adj){
      const seen=new Set();
      for(const r of todo){const k=bk(r.item,r.color);if(seen.has(k)){toast("الصنف «"+r.item+(r.color?" · "+r.color:"")+"» مكرر في التسوية");return false}seen.add(k)}
      for(const r of todo){r.cur=leftOf(r.item,r.color)||0;r.q=r.actual-r.cur}
      const diff=todo.filter(r=>r.q!==0);
      if(!diff.length){toast("الجرد مطابق، مفيش فرق");return false}
      todo.length=0;todo.push(...diff);
    }
    const d=document.getElementById("s-d").value||today(),note=document.getElementById("s-n").value.trim()||null;
    if(!await reviewSave({title:"راجع الجرد قبل الحفظ",meta:[["التاريخ",fmtD(d)],["النوع",adj?"تسوية جرد":"دخل التصليح"]],
      items:todo.map(r=>({title:r.item,rows:[...(r.color?[["اللون",r.color]]:[]),...(adj?[["الموجود فعلًا",nf(r.actual)]]:[]),[adj?"الفرق":"الكمية",(r.q>0?"+":"")+nf(r.q)]]})),
      ...(adj?{}:{total:todo.reduce((a,r)=>a+r.q,0)})}))return false;
    const kind=adj?"adjust":"in";
    const{error}=await db.from("repair_stock").insert(todo.map(r=>({stock_date:d,item:r.item,color:r.color||null,qty:r.q,kind,note,client_id:(crypto.randomUUID?crypto.randomUUID():null)})));
    if(error&&/color/.test(error.message||"")){toast("شغّل ملف setup_repair_color.sql في Supabase الأول");return false}
    if(error&&/repair_stock/.test(error.message||"")){toast("شغّل ملف setup_repair_stock.sql في Supabase الأول");return false}
    if(error){toast("خطأ: "+error.message);return false}
    await loadStock();toast("تم حفظ "+todo.length+" سطر");
  },"حفظ الكل");
  const box=document.getElementById("srows");
  const renum=()=>{const r=[...box.querySelectorAll(".mrow")];r.forEach((e,i)=>{e.querySelector(".mn").textContent="صنف "+(i+1);e.querySelector(".rmi").hidden=r.length<2})};
  const add=(focus,preset)=>{
    box.insertAdjacentHTML("beforeend",rowHtml());
    const el=box.lastElementChild;enhanceAll(el);renum();
    if(preset)el.querySelector(".it").value=preset;
    el.querySelector(".rmi").onclick=()=>{el.remove();renum()};
    const hintEl=el.querySelector(".sc"),upd=()=>{ // المتبقي الحالي في الجرد لنفس الصنف واللون (وفرق التسوية لو عامل تسوية)
      const it=el.querySelector(".it").value.trim(),co=el.querySelector(".sb").value.trim(),cur=leftOf(it,co);
      if(!it){hintEl.textContent="";return}
      if(cur===null){hintEl.textContent="صنف جديد في الجرد";return}
      const qv=el.querySelector(".mq2").value.trim(),n=parseInt(qv);
      hintEl.textContent="المتبقي الحالي: "+nf(cur)+(adj&&qv!==""&&!isNaN(n)?" ← الفرق: "+(n-cur>0?"+":"")+nf(n-cur):"");
    };
    el.addEventListener("input",upd);el.addEventListener("change",upd);
    el.querySelector(".rmc").onclick=()=>{ // لون آخر لنفس الصنف: سطر جديد بنفس الاسم والتركيز على اللون
      add(false,el.querySelector(".it").value.trim());
      const n=box.lastElementChild;n.scrollIntoView({block:"nearest",behavior:"smooth"});n.querySelector(".sb").focus();
    };
    // Enter: ينقل للحقل اللي بعده، ومن الكمية في آخر سطر يفتح سطر جديد (من غير ما يحفظ بالغلط)
    el.addEventListener("keydown",e=>{
      if(e.key!=="Enter"||e.target.tagName!=="INPUT"||e.defaultPrevented)return;
      e.preventDefault();e.stopPropagation();
      const f=[...el.querySelectorAll("input:not([type=hidden])")],i=f.indexOf(e.target);
      if(i>=0&&i<f.length-1)f[i+1].focus();
      else if(el===box.lastElementChild)add(true);
      else{const n=el.nextElementSibling;if(n)n.querySelector(".it").focus()}
    });
    if(focus){el.querySelector(".it").focus();el.scrollIntoView({block:"nearest",behavior:"smooth"})}
  };
  add(true);
  document.getElementById("sadd").onclick=()=>add(true);
}
function stForm(id,adjust){if(roBlock())return;
  if(!id){stMulti(!!adjust);return} // إضافة جديدة: أكتر من صنف ولون مرة واحدة
  const rec=id?stock.find(r=>r.id===id):null,adj=rec?rec.kind==="adjust":!!adjust;
  const items=stItems();
  openModal(rec?"تعديل حركة جرد":adj?"تسوية جرد":"إضافة للتصليح",`<label>التاريخ</label><input type="date" id="s-d" value="${rec?rec.d:today()}">
    <label>الصنف</label><input id="s-item" class="it" list="s-items" autocomplete="off" value="${rec?esc(rec.item):""}"><datalist id="s-items">${items.map(i=>`<option value="${esc(i)}">`).join("")}</datalist>
    <label>اللون (اختياري)</label><input id="s-color" class="sb" data-kind="color" autocomplete="off" maxlength="80" value="${rec?esc(rec.color):""}">
    <label>${adj?"الكمية الفعلية الموجودة الآن":"الكمية"}${rec&&adj?" (الفرق، موجب أو سالب)":""}</label><input type="number" id="s-q" inputmode="numeric" ${rec?"":'min="1"'} value="${rec?rec.qty:""}">
    <label>ملاحظة (اختياري)</label><input id="s-n" maxlength="300" value="${rec?esc(rec.note):""}">`,async()=>{
    const item=document.getElementById("s-item").value.trim();
    let q=parseInt(document.getElementById("s-q").value);
    if(!item){toast("اكتب اسم الصنف");return false}
    if(!q&&q!==0||isNaN(q)){toast("اكتب كمية صحيحة");return false}
    let kind=adj?"adjust":"in";
    if(adj&&!rec){ // التسوية: المستخدم يكتب الموجود فعلًا، والفرق عن المتبقي الحالي هو اللي يتسجّل
      const cur=leftOf(item,document.getElementById("s-color").value.trim())||0;q=q-cur;
      if(q===0){toast("الجرد مطابق، مفيش فرق");return false}
    }
    if(!adj&&q<1){toast("اكتب كمية صحيحة");return false}
    if(q===0){toast("الكمية لازم تختلف عن صفر");return false}
    const row={stock_date:document.getElementById("s-d").value||today(),item,color:document.getElementById("s-color").value.trim()||null,qty:q,kind,note:document.getElementById("s-n").value.trim()||null};
    if(!await reviewSave({title:"راجع الجرد قبل الحفظ",meta:[["التاريخ",fmtD(row.stock_date)],["النوع",adj?"تسوية جرد":"دخل التصليح"]],items:[{title:item,rows:[...(row.color?[["اللون",row.color]]:[]),[adj?"الفرق":"الكمية",(q>0?"+":"")+nf(q)]]}]}))return false;
    const{error}=rec?await db.from("repair_stock").update(row).eq("id",id):await db.from("repair_stock").insert({...row,client_id:(crypto.randomUUID?crypto.randomUUID():null)});
    if(error&&/color/.test(error.message||"")){toast("شغّل ملف setup_repair_color.sql في Supabase الأول");return false}
    if(error&&/repair_stock/.test(error.message||"")){toast("شغّل ملف setup_repair_stock.sql في Supabase الأول");return false}
    if(error){toast("خطأ: "+error.message);return false}
    await loadStock();toast(rec?"تم التعديل":"تم الحفظ");
  });
}
async function stDel(id){
  if(!await ask("حذف حركة الجرد دي؟"))return;
  const{data:dd,error}=await db.from("repair_stock").delete().eq("id",id).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  await loadStock();toast("تم الحذف");
}
function drawStats(){
  const t=today(),m=t.slice(0,8)+"01";
  kpis("stats",[["تصليح النهارده",sumQty(rows,t,t),"var(--ok)"],["هذا الشهر",sumQty(rows,m,t)],["الإجمالي",rows.reduce((a,r)=>a+r.qty,0)]]);
}
function setTab(){
  document.getElementById("t-log").className="btn "+(tab==="log"?"on":"ghost");
  document.getElementById("t-stock").className="btn "+(tab==="stock"?"on":"ghost");
  document.getElementById("t-prod").className="btn "+(tab==="prod"?"on":"ghost");
  document.getElementById("logView").style.display=tab==="log"?"block":"none";
  document.getElementById("stockView").style.display=tab==="stock"?"block":"none";
  document.getElementById("prodRep").style.display=tab==="prod"?"block":"none";
  try{history.replaceState(null,"",tab==="prod"?"#reports":tab==="stock"?"#stock":location.pathname+location.search)}catch(e){}
  if(tab==="prod")repCtl?repCtl.refresh():repCtl=Reports.mount("prodRep","repair");
}
function filtered(){
  const f=document.getElementById("f-from").value,t=document.getElementById("f-to").value,i=document.getElementById("f-item").value;
  return rows.filter(r=>(!f||r.d>=f)&&(!t||r.d<=t)&&(!i||(i==="__none"?!r.item:r.item===i))&&hit(Q,r.item,r.color,r.w));
}
function draw(){
  const rs=filtered(),sum=rs.reduce((a,r)=>a+r.qty,0);
  document.getElementById("total").textContent="إجمالي التصليح: "+sum;
  const by={};rs.forEach(r=>{const k=r.item||NONE;by[k]=(by[k]||0)+r.qty});
  document.getElementById("brk").textContent=Object.keys(by).length>1?Object.entries(by).map(([k,v])=>k+": "+v).join(" · "):"";
  document.getElementById("body").innerHTML=rs.length?rs.map(r=>`<tr><td>${fmtD(r.d)}</td><td>${r.item?esc(r.item):'<span class="nums">'+NONE+'</span>'}</td><td>${r.color?esc(r.color):'<span class="nums">—</span>'}</td><td>${r.w?esc(r.w):'<span class="nums">—</span>'}</td><td><b>${r.qty}</b></td><td class="noprint" style="white-space:nowrap"><button class="btn ghost sm" onclick="repForm(${r.id})">تعديل</button> <button class="btn ghost sm" onclick="del(${r.id})">حذف</button></td></tr>`).join(""):'<tr><td colspan="6" class="empty">مفيش تصليح مسجل</td></tr>';
}
function repForm(id){if(roBlock())return;
  if(!id){freeProduction("repair",load);return} // تسجيل جديد: أكتر من صنف لنفس العامل
  const rec=id?rows.find(r=>r.id===id):null;
  const items=[...new Set(rows.map(r=>r.item).filter(Boolean))];
  wkLoad();
  openModal(rec?"تعديل تصليح":"تسجيل تصليح",`<label>التاريخ</label><input type="date" id="m-d" value="${rec?rec.d:today()}">
    <label>الصنف (اختياري)</label><input id="m-item" list="m-items" value="${rec?esc(rec.item):""}"><datalist id="m-items">${items.map(i=>`<option value="${esc(i)}">`).join("")}</datalist>
    <label>اللون (اختياري)</label><input id="m-color" maxlength="80" value="${rec?esc(rec.color):""}">
    ${XW(false)}
    <label>الكمية</label><input type="number" id="m-q" min="1" inputmode="numeric" value="${rec?rec.qty:""}">`,async()=>{
    const q=parseInt(document.getElementById("m-q").value);
    if(!q||q<1){toast("اكتب كمية صحيحة");return false}
    const row={repair_date:document.getElementById("m-d").value||today(),item:document.getElementById("m-item").value.trim()||null,color:document.getElementById("m-color").value.trim()||null,qty:q,worker:xfRead().worker||null};
    const lf=leftOf(row.item,row.color);
    if(lf!==null&&q>lf+(rec&&norm(rec.item)===norm(row.item)&&norm(rec.color)===norm(row.color)?rec.qty:0)&&!await ask("المتبقي في جرد التصليح لصنف «"+row.item+(row.color?" · "+row.color:"")+"» هو "+nf(lf)+" وانت بتسجّل "+nf(q)+". تكمّل؟","نعم، كمّل"))return false;
    if(!await reviewSave({title:"راجع التصليح قبل الحفظ",meta:[["التاريخ",fmtD(row.repair_date)],...(row.worker?[["العامل",row.worker]]:[])],items:[{title:row.item||"بدون صنف",rows:[...(row.color?[["اللون",row.color]]:[]),["الكمية",nf(q)]]}]}))return false;
    let{error}=rec?await db.from("repair_log").update(row).eq("id",id):await db.from("repair_log").insert(row);
    if(error&&/color/.test(error.message||"")){toast("شغّل ملف setup_repair_color.sql في Supabase الأول");return false}
    if(error&&/worker/.test(error.message||"")){toast("شغّل ملف setup_repair_worker.sql في Supabase الأول");return false}
    if(error){toast("خطأ: "+error.message);return false}
    await load();toast(rec?"تم التعديل":"تم التسجيل");
  });
}
async function del(id){
  if(!await ask("حذف السجل ده؟"))return;
  const{data:dd,error}=await db.from("repair_log").delete().eq("id",id).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  await load();toast("تم الحذف");
}
function exportCsv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv="\uFEFF"+["التاريخ,الصنف,اللون,العامل,الكمية",...filtered().map(r=>[r.d,r.item||NONE,r.color,r.w,r.qty].map(q).join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="تصليح.csv";a.click();
}
document.getElementById("add").onclick=()=>repForm(0);

document.getElementById("f-csv").onclick=exportCsv;

document.getElementById("t-prod").onclick=()=>{tab="prod";setTab()};

document.getElementById("st-imp").onclick=stImport;

document.getElementById("st-prt").onclick=()=>window.print();
{const lw=document.getElementById("st-low");lw.value=LOW()||"";lw.onchange=()=>{try{localStorage.setItem("repair_low",String(parseInt(lw.value)||0))}catch(e){}drawStock()}}
(async()=>{if(await requireAuth("repair.html")){renderNav("repair.html");searchBox("tbl",q=>{Q=q;draw()},"بحث بالصنف أو اللون أو العامل…");dateChips("f-from","f-to",draw);skel("body",4);if(tab!=="log")setTab();load().finally(settle)}})();
