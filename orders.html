<div class="wrap">
  <h1>الطلبيات</h1>
  <div class="tabs noprint"><button class="btn on" id="t-open">مفتوحة</button><button class="btn ghost" id="t-done">مكتملة</button></div>

<script>
const SECK={glaze:{n:"جليز",page:"glaze.html",c:"#2E6F80",lbl:"اللون"},deco:{n:"زخرفة",page:"decoration.html",c:"#5E5A8C",lbl:"الكود"},spray:{n:"رش",page:"spray.html",c:"#B8862B",lbl:"اللون"},casting:{n:"الصب اليدوي",page:"casting.html",c:"#8A5A3C",lbl:"الكمية"},brush:{n:"البرشر",page:"brush.html",c:"#A0522D",lbl:"الكمية"}};
const QS=k=>k==="casting"||k==="brush"; // أقسام بالكمية بس (من غير ألوان/أكواد)
const QT={casting:"casting_orders",brush:"brush_orders"};
// أيقونة القسم (جليز/زخرفة/رش) بلونه، بتتعرض جنب اسمه
const secIco=k=>`<span class="ico" style="display:inline-flex;vertical-align:middle;margin-inline-end:5px;color:${SECK[k].c}">${ico(k).replace("<svg",'<svg style="width:16px;height:16px"')}</span>`;
let G=[],tab="open",Q="",broken=false,ext=false,dlv=false,dtab=false,CUS=[],cusOk=false;
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
function mkItem(item,status,date,due,lines,ids){
  const req=sum(lines,l=>l.req),done=sum(lines,l=>Math.min(l.done,l.req));
  return{item,status,date,due,lines,req,done,ids};
}
async function saveCus(n,p){
  if(!cusOk||!n)return;
  try{const c=CUS.find(x=>norm(x.name)===norm(n));
    if(c){if(p&&p!==c.phone)await db.from("customers").update({phone:p}).eq("id",c.id)}
    else await db.from("customers").insert({name:n,phone:p||null})}catch(e){}
}
async function load(){
  const[g,go,gl,dO,dl,sp,so,cu,dr,co,cl,bo,bl]=await Promise.all([

    (async()=>{const q=c=>db.from("order_groups").select(c).order("created_at",{ascending:false});
      let r=await q("id,title,created_at,order_no,customer_phone,notes,delivered_at,delivery_note");
      if(!r.error){ext=true;dlv=true;return r}
      dlv=false;r=await q("id,title,created_at,order_no,customer_phone,notes");
      if(!r.error){ext=true;return r}
      ext=false;return q("id,title,created_at")})(),
    db.from("glaze_orders").select("id,item,status,order_date,due_date,group_id").not("group_id","is",null),
    db.from("glaze_lines_status").select("id,order_id,color,total_required,produced"),
    db.from("deco_orders").select("id,item,status,order_date,due_date,group_id").not("group_id","is",null),
    db.from("deco_lines_status").select("id,order_id,code,total_required,produced"),
    db.from("spray_status").select("*"),
    (async()=>{let r=await db.from("spray_orders").select("id,group_id,order_date,due_date,spray_color").not("group_id","is",null);if(r.error)r=await db.from("spray_orders").select("id,group_id,order_date,due_date").not("group_id","is",null);return r})(),
    db.from("customers").select("id,name,phone").order("name"),
    db.from("order_deliveries").select("id,group_id,delivered_on,qty_done,qty_short,is_final,note,created_at").order("delivered_on").order("created_at"),
    db.from("casting_orders").select("id,item,status,order_date,due_date,group_id,qty_required").not("group_id","is",null),
    db.from("casting_log").select("order_id,qty").not("order_id","is",null),
    db.from("brush_orders").select("id,item,status,order_date,due_date,group_id,qty_required").not("group_id","is",null),
    db.from("brush_log").select("order_id,qty").not("order_id","is",null)
  ]);
  dtab=!dr.error;
  cusOk=!cu.error;CUS=cusOk?(cu.data||[]):[];
  if(g.error||go.error||dO.error||so.error){broken=true;draw();return}
  broken=false;
  const M=new Map(g.data.map(x=>[x.id,{id:x.id,title:(x.title||"").trim(),no:x.order_no||null,phone:(x.customer_phone||"").trim(),dvs:[],notes:(x.notes||"").trim(),deliv:x.delivered_at||null,dnote:(x.delivery_note||"").trim(),created:String(x.created_at||"").slice(0,10),secs:{glaze:[],deco:[],spray:[],casting:[],brush:[]}}]));
  if(dtab)(dr.data||[]).forEach(d=>{const m=M.get(d.group_id);if(m)m.dvs.push({id:d.id,d:d.delivered_on,q:d.qty_done,s:d.qty_short,f:!!d.is_final,n:(d.note||"").trim()})});
  const by=(a,k)=>{const m=new Map();(a||[]).forEach(x=>{if(!m.has(x[k]))m.set(x[k],[]);m.get(x[k]).push(x)});return m};
  const glL=by(gl.data,"order_id"),dlL=by(dl.data,"order_id");
  go.data.forEach(o=>{const m=M.get(o.group_id);if(!m)return;m.secs.glaze.push(mkItem(o.item,o.status,o.order_date,o.due_date,(glL.get(o.id)||[]).map(l=>({id:l.id,l:l.color,req:+l.total_required||0,done:+l.produced||0})),[o.id]))});
  dO.data.forEach(o=>{const m=M.get(o.group_id);if(!m)return;m.secs.deco.push(mkItem(o.item,o.status,o.order_date,o.due_date,(dlL.get(o.id)||[]).map(l=>({id:l.id,l:l.code,req:+l.total_required||0,done:+l.produced||0})),[o.id]))});
  const sm=new Map(so.data.map(x=>[x.id,x])),tmp=new Map();
  (sp.data||[]).forEach(r=>{const x=sm.get(r.id);if(!x||!M.has(x.group_id))return;const k=x.group_id+"|"+r.item;let t=tmp.get(k);if(!t){t={g:x.group_id,item:r.item,st:"done",date:x.order_date,due:x.due_date,lines:[],ids:[]};tmp.set(k,t)}if(r.status==="open")t.st="open";t.lines.push({l:r.color,sc:(x.spray_color||"").trim(),req:+r.qty_required||0,done:+r.produced||0});t.ids.push(r.id)});
  tmp.forEach(t=>M.get(t.g).secs.spray.push(mkItem(t.item,t.st,t.date,t.due,t.lines,t.ids)));
  // الصب اليدوي: كل صنف سطر واحد، والمنتج = مجموع قطع تسجيلات الصب المربوطة بالطلبية
  if(!co.error){const cd=new Map();(cl.data||[]).forEach(r=>cd.set(r.order_id,(cd.get(r.order_id)||0)+(+r.qty||0)));
    (co.data||[]).forEach(o=>{const m=M.get(o.group_id);if(!m)return;const req=+o.qty_required||0,dn=cd.get(o.id)||0;
      m.secs.casting.push(mkItem(o.item,(o.status==="done"||dn>=req)?"done":"open",o.order_date,o.due_date,[{id:o.id,l:"الكمية",req,done:dn}],[o.id]))})}
// البرشر: نفس منطق الصب (كل صنف سطر واحد، والمنتج = مجموع تسجيلات البرشر المربوطة بالطلبية)
if(!bo.error){const bd=new Map();(bl.data||[]).forEach(r=>bd.set(r.order_id,(bd.get(r.order_id)||0)+(+r.qty||0)));
(bo.data||[]).forEach(o=>{const m=M.get(o.group_id);if(!m)return;const req=+o.qty_required||0,dn=bd.get(o.id)||0;
m.secs.brush.push(mkItem(o.item,(o.status==="done"||dn>=req)?"done":"open",o.order_date,o.due_date,[{id:o.id,l:"الكمية",req,done:dn}],[o.id]))})}
  G=[...M.values()].map(o=>{
    const all=Object.values(o.secs).flat(),open=!o.deliv&&all.some(i=>i.status==="open"),dues=all.map(i=>i.due).filter(Boolean).sort(),dts=all.map(i=>i.date).filter(Boolean).sort();
    const req=sum(all,i=>i.req),done=sum(all,i=>i.done);
    return{...o,all,open:open||(!o.deliv&&o.dvs.length>0&&req>done),due:dues[0]||null,date:dts[0]||o.created,req,done,rem:Math.max(req-done,0),pct:req?Math.min(100,Math.round(done/req*100)):0,
      short:Object.entries(o.secs).flatMap(([k,a])=>a.flatMap(i=>i.lines.filter(l=>l.req>l.done).map(l=>({k,item:i.item,l:l.l+(l.sc?" ← رش "+l.sc:""),n:l.req-l.done})))),
      late:!o.deliv&&all.some(i=>i.status==="open"&&lateOrder({status:"open",due_date:i.due,order_date:i.date}))};
  });
  draw();
}
const itemHtml=i=>{const pct=i.req?Math.min(100,Math.round(i.done/i.req*100)):0;
  return `<div style="margin-top:8px"><div class="r"><b>${esc(i.item)}</b>${i.status==="open"?"":' <span class="tag ok">مكتمل</span>'} <span class="nums">تم <b>${nf(i.done)}</b> من <b>${nf(i.req)}</b></span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="nums" style="font-size:.85rem">${i.lines.map(l=>esc(l.l)+(l.sc?" ← رش "+esc(l.sc):"")+": "+nf(Math.min(l.done,l.req))+"/"+nf(l.req)).join(" · ")}</div></div>`};
const dvTimes=n=>n===1?"مرة واحدة":n===2?"مرتين":n<=10?n+" مرات":n+" مرة";
function dvHtml(o){
  let L=o.dvs.slice();
  if(!L.length&&o.deliv)L=[{d:o.deliv,q:null,s:null,f:true,n:o.dnote}];
  if(!L.length)return"";
  let prev=0;
  const rows=L.map((x,i)=>{
    const dq=x.q==null?null:Math.max(x.q-prev,0);if(x.q!=null)prev=x.q;
    return `<div class="nums" style="font-size:.85rem">• تسليم ${i+1}: <b>${fmtD(x.d)}</b>${dq!=null?` — سُلّم <b>${nf(dq)}</b>`:""}${x.s!=null&&x.s>0?` · عجز وقتها ${nf(x.s)}`:""}${x.f?" · نهائي":""}${x.n?`<div class="hint" style="margin:0">${esc(x.n)}</div>`:""}</div>`;
  }).join("");
  const head=o.deliv?`تم تسليم الطلبية على ${dvTimes(L.length)}`:`اتسلّمت ${dvTimes(L.length)} (تسليم جزئي)`;
  const miss=o.short.length?`<div class="nums" style="color:var(--bad,#b3261e);font-weight:700">${o.deliv?"سُلّمت بعجز":"العجز الحالي"} ${nf(o.rem)} قطعة:</div>${o.short.map(x=>`<div class="nums" style="font-size:.85rem">• ${SECK[x.k].n} · ${esc(x.item)} (${esc(x.l)}) — عجز <b>${nf(x.n)}</b></div>`).join("")}`:`<div class="nums">${o.deliv?"سُلّمت كاملة بدون عجز":"مفيش عجز حاليًا"}</div>`;
  return `<div class="line"><div class="r"><b>${head}</b></div>${rows}${o.deliv&&o.all.some(i=>i.status==="open")?'<div class="nums">الأقسام لسه مفتوحة وتقدر تكمّل الإنتاج</div>':""}${miss}</div>`;
}
function card(o){
  const ks=Object.keys(SECK).filter(k=>o.secs[k].length);
  return `<div class="card ogrp oc"><div class="top ohd"><b>${o.no?"#"+o.no+" · ":""}${esc(o.title||"طلبية بدون اسم")}</b><span>${o.late?'<span class="tag late">متأخرة</span> ':""}<span class="tag ${o.open?"":"ok"}">${o.deliv?"تم التسليم":o.dvs.length&&o.open?"تسليم جزئي":o.open?"مفتوحة":"مكتملة"}</span></span></div>
    ${o.phone?`<div class="nums">الموبايل: <a href="tel:${esc(o.phone.replace(/[^\d+]/g,""))}" dir="ltr">${esc(o.phone)}</a>${waNum(o.phone)?` · <a href="https://wa.me/${waNum(o.phone)}" target="_blank" rel="noopener">واتساب</a>`:""}</div>`:""}
    ${o.notes?`<div class="hint" style="margin:2px 0 6px">${esc(o.notes)}</div>`:""}
    <div class="nums">${o.due?`التسليم: <b>${fmtD(o.due)}</b> · `:""}تاريخ الطلبية: <b>${fmtD(o.date)}</b></div>
    <div class="nums">الإجمالي: مطلوب <b>${nf(o.req)}</b> · تم <b>${nf(o.done)}</b> · متبقي <b>${nf(o.rem)}</b></div>
    <div class="bar"><i style="width:${o.pct}%"></i></div>
    ${dvHtml(o)}
    ${ks.length?ks.map(k=>`<div class="line"><div class="r"><span class="badge" style="--c:${SECK[k].c};display:inline-flex;align-items:center">${secIco(k)}${SECK[k].n}</span><a class="tag" href="${SECK[k].page}">فتح القسم</a></div>${o.secs[k].map(itemHtml).join("")}</div>`).join(""):'<div class="empty">لسه ما اتوزعتش على قسم</div>'}
    <div class="row">${o.deliv?`${o.all.some(i=>i.status==="open")?`<button class="btn sm" onclick="closeSecs('${o.id}')">قفل في الأقسام</button>`:""}<button class="btn sm" onclick="undoDeliver('${o.id}')">${o.dvs.length?"إلغاء آخر تسليم":"إلغاء التسليم"}</button>`:`<button class="btn sm" onclick="openForm('${o.id}')">+ توزيع صنف</button>${ks.length?`<button class="btn sm" onclick="increaseG('${o.id}')">زيادة الطلبية</button><button class="btn ghost sm" onclick="editItems('${o.id}')">تعديل الأصناف</button>`:""}${dlv&&ks.length?`<button class="btn sm" onclick="deliverG('${o.id}')">${o.dvs.length?"تسليم جديد":"تسليم الطلبية"}</button>`:""}${o.dvs.length?`<button class="btn ghost sm" onclick="undoDeliver('${o.id}')">إلغاء آخر تسليم</button>`:""}`}<button class="btn ghost sm" onclick="editG('${o.id}')">تعديل البيانات</button><button class="btn ghost sm" onclick="delG('${o.id}')">حذف الطلبية كلها</button></div></div>`;
}
function draw(){
  const box=document.getElementById("orders");
  if(broken){document.getElementById("stats").innerHTML="";box.innerHTML='<div class="card empty">جدول الطلبيات مش جاهز.<br>شغّل ملف <b>setup_order_groups.sql</b> مرة واحدة في Supabase › SQL Editor وبعدين حدّث الصفحة.</div>';return}
  const open=G.filter(o=>o.open);
  kpis("stats",[["طلبيات مفتوحة",open.length],["متأخرة",open.filter(o=>o.late).length,open.some(o=>o.late)?"var(--late,#c0392b)":undefined],["المتبقي للإنجاز",nf(sum(open,o=>o.rem))]]);
  const list=G.filter(o=>(tab==="open")===o.open&&(!Q||((o.title+" "+(o.no||"")+" "+o.phone+" "+o.notes+" "+o.all.map(i=>i.item+" "+i.lines.map(l=>l.l+" "+(l.sc||"")).join(" ")).join(" ")).toLowerCase().includes(Q.toLowerCase()))));
  box.innerHTML=list.length?list.map(card).join(""):`<div class="empty">${Q?"مفيش نتائج للبحث":tab==="open"?"مفيش طلبيات مفتوحة. اضغط «طلبية جديدة».":"مفيش طلبيات مكتملة."}</div>`;
}
function setTab(t){t=t||tab;tab=t;document.getElementById("t-open").className="btn "+(t==="open"?"on":"ghost");document.getElementById("t-done").className="btn "+(t==="done"?"on":"ghost");draw()}
function openForm(gid){if(roBlock())return;
  const g=gid?G.find(x=>x.id===gid):null;
  const crow=k=>QS(k)?`<div class="nr"><input class="c" type="hidden" value="الكمية"><input placeholder="الكمية المطلوبة" class="q" type="number" min="1" inputmode="numeric"></div>`:k==="spray"?`<div class="nr"><div class="two"><input placeholder="لون الصنف" class="c" data-kind="color"><input placeholder="لون الرش المطلوب" class="msc" data-kind="color" maxlength="60"></div><input placeholder="الكمية" class="q" type="number" min="1" inputmode="numeric"></div>`:`<div class="two nr"><input placeholder="${SECK[k].lbl}" class="c" data-kind="${k==="deco"?"code":"color"}"><input placeholder="الكمية" class="q" type="number" min="1" inputmode="numeric"></div>`;
  const curK=()=>{const e=document.getElementById("m-sec");return e?e.value:"glaze"};
  const llt=k=>QS(k)?"الكمية":(k==="deco"?"الأكواد":"الألوان")+" والكميات";
  const blk=n=>{const k=curK();return `<div class="itemblk" data-k="${k}"><div class="ih"><b>الصنف ${n}</b><button type="button" class="rmi" style="display:${n>1?"block":"none"}">${ib("trash","حذف الصنف")}</button></div><input class="it" placeholder="اسم الصنف"><label class="ll">${llt(k)}</label><div class="rows">${crow(k)}</div><button class="btn ghost sm addc" type="button" style="display:${QS(k)?"none":""}">+ سطر</button></div>`};

  const iz=document.getElementById("m-iz"),lz=document.getElementById("m-lz"),nw=document.getElementById("m-nw");
  const fillLines=()=>{const x=items[+iz.value];
    lz.innerHTML=x.it.lines.map((l,n)=>`<option value="${n}">${esc(l.l)}${l.sc?" ← رش "+esc(l.sc):""} (مطلوب ${nf(l.req)})</option>`).join("")+(QS(x.k)?"":`<option value="new">+ ${x.k==="deco"?"كود":"لون"} جديد</option>`);
    showNew()};
  const showNew=()=>{const x=items[+iz.value],on=lz.value==="new";nw.style.display=on?"block":"none";
    document.getElementById("m-nwl").textContent=x.k==="deco"?"الكود الجديد":"اللون الجديد";
      {const nc=document.getElementById("m-nwc"),k=x.k==="deco"?"code":"color";nc.dataset.kind=k;if(nc.dataset.cb)nc.dataset.cb=k}
    document.getElementById("m-nws").style.display=x.k==="spray"?"block":"none"};
  iz.onchange=fillLines;lz.onchange=showNew;fillLines();
}
function editG(id){if(roBlock())return;
  const g=G.find(x=>x.id===id);if(!g)return;
  openModal("تعديل بيانات الطلبية",`<label>الاسم / العميل</label><input id="m-rn" maxlength="80" value="${esc(g.title)}">${ext?`<label>موبايل العميل (اختياري)</label><input id="m-ph" type="tel" inputmode="tel" maxlength="20" dir="ltr" value="${esc(g.phone)}"><label>ملاحظات (اختياري)</label><input id="m-nt" maxlength="300" value="${esc(g.notes)}">`:""}`,async()=>{
    const row={title:document.getElementById("m-rn").value.trim()||null};
    if(ext){const ph=document.getElementById("m-ph").value.trim(),nt=document.getElementById("m-nt").value.trim();
      if(ph&&!/^[\d+\s-]{6,20}$/.test(ph)){toast("رقم الموبايل غير صحيح");return false}
      row.customer_phone=ph||null;row.notes=nt||null}
    const{error}=await db.from("order_groups").update(row).eq("id",id);
    if(error){toast("خطأ: "+error.message);return false}
    if(ext)await saveCus(row.title||"",row.customer_phone||"");
    await load();toast("تم الحفظ");
  });
}
async function delG(id){if(roBlock())return;
  const sg=(G.find(x=>x.id===id)||{secs:{}}).secs,hasC=sg.casting?.length>0||sg.brush?.length>0;
  if(!await ask("حذف الطلبية كلها وكل أصنافها من كل الأقسام؟"+(hasC?" تسجيلات الصب والبرشر المرتبطة بيها هتفضل في سجلاتها كإنتاج بدون طلبية.":"")))return;
  for(const t of["glaze_orders","deco_orders","spray_orders"]){
    const{error}=await db.from(t).delete().eq("group_id",id);
    if(error){toast("خطأ: "+error.message);return}
  }
  try{await db.from("casting_orders").delete().eq("group_id",id)}catch(e){}
  try{await db.from("brush_orders").delete().eq("group_id",id)}catch(e){}
  const{error}=await db.from("order_groups").delete().eq("id",id);
  if(error){toast("خطأ: "+error.message);return}
  await load();toast("تم حذف الطلبية");
}
(async()=>{if(await requireAuth("orders.html")){renderNav("orders.html");
  document.getElementById("t-open").onclick=()=>setTab("open");document.getElementById("t-done").onclick=()=>setTab("done");
  document.getElementById("newG").onclick=()=>openForm(null);
  let qt=null;document.getElementById("q").oninput=e=>{clearTimeout(qt);const v=e.target.value.trim();qt=setTimeout(()=>{Q=v;draw()},200)};
  document.getElementById("orders").innerHTML='<i class="sk" style="height:140px;border-radius:14px"></i>';
  await load();settle()}})();
</script>
