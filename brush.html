<script>
let rows=[],orders=[],ordersOk=false,Q="",repCtl=null,oFilter="open",
    tab=location.hash==="#reports"?"prod":(location.hash==="#orders"||location.hash==="#open")?"ord":"log";
const NONE="بدون صنف",SHIFTS=["صباحي","مسائي","ليلي"],V2_ERR=/shift|scrap|order_id|brush_orders|schema cache/i;
const ordOf=id=>orders.find(o=>o.id===id)||null;
const oLab=o=>o?((o.no?"#"+o.no:"")+(o.no?" · ":"")+(o.title?o.title+" — ":"")+o.item):"";
// المتحفظ على الجهاز بدون نت (لسه ما اتبعتش) بيتحسب من المتبقي عشان الربط التلقائي ما يزوّدش على طلبية اتملّت
const pendQ=id=>Q_.get().filter(i=>i.sec==="brush"&&i.rid===id).reduce((a,i)=>a+(+i.qty||0),0);
const lastShift=()=>{try{return localStorage.getItem("cast_shift")||""}catch(e){return ""}};

async function load(){
  brcLoad();
  const[a,b,gr]=await Promise.all([
    db.from("brush_log").select("*").order("brush_date",{ascending:false}).order("id",{ascending:false}),
    db.from("brush_orders").select("*").order("id",{ascending:false}),
    db.from("order_groups").select("id,title,order_no")]);
  const GM=new Map(((gr&&gr.data)||[]).map(x=>[x.id,x]));
  if(a.error){
    if(/brush_log|relation|schema cache|does not exist/i.test(a.error.message||"")){
      document.getElementById("body").innerHTML='<tr><td colspan="9" class="empty err-state">جدول البرشر غير موجود. شغّل ملف setup_brush.sql من Supabase (SQL Editor) مرة واحدة.<br><button class="btn sm" onclick="load()">إعادة المحاولة</button></td></tr>';return}
    fail("body",load);return}
  ordersOk=!b.error;
  orders=ordersOk?(b.data||[]).map(o=>{const g=GM.get(o.group_id);return{id:o.id,gid:o.group_id||null,title:g?(g.title||"").trim():(o.title||""),no:g&&g.order_no||null,item:o.item,req:o.qty_required,od:o.order_date,due:o.due_date||"",st:o.status,n:o.note||""}}):[];
  rows=a.data.map(r=>({id:r.id,d:r.brush_date,item:r.item||"",qty:r.qty,sc:r.scrap||0,isw:!(+r.qty>0)&&+r.scrap>0,sh:r.shift||"",oid:r.order_id||null,w:r.worker||"",n:r.note||"",by:r.created_by||null,mo:r.molds==null?null:+r.molds,po:r.pours==null?null:+r.pours}));
  fillSel("f-item",[...new Set(rows.map(r=>r.item).filter(Boolean))],'<option value="__none">'+NONE+'</option>');
  fillSel("f-wk",[...new Set(rows.map(r=>r.w).filter(Boolean))],'<option value="__none">بدون عامل</option>');
  draw();drawStats();drawOrders();
  document.getElementById("t-ord").style.display=ordersOk?"":"none";
}
function fillSel(id,vals,extra){
  const s=document.getElementById(id),cur=s.value;
  s.innerHTML='<option value="">الكل</option>'+(extra||"")+vals.sort((a,b)=>a.localeCompare(b,"ar")).map(v=>`<option>${esc(v)}</option>`).join("");
  s.value=cur;
}
function drawStats(){
  const t=today(),m=t.slice(0,8)+"01";
  const scr=rows.reduce((a,r)=>a+(r.d>=m&&r.d<=t?r.sc:0),0);
  kpis("stats",[["إنتاج النهارده",sumQty(rows,t,t),"var(--ok)"],["هذا الشهر",sumQty(rows,m,t)],["هالك هذا الشهر",scr,scr?"var(--bad,#b3261e)":""]]);
}
function setTab(){
  ["log","ord","prod"].forEach(k=>document.getElementById("t-"+k).className="btn "+(tab===k?"on":"ghost"));
  document.getElementById("logView").style.display=tab==="log"?"block":"none";
  document.getElementById("ordView").style.display=tab==="ord"?"block":"none";
  document.getElementById("prodRep").style.display=tab==="prod"?"block":"none";
  try{history.replaceState(null,"",tab==="prod"?"#reports":tab==="ord"?"#orders":location.pathname+location.search)}catch(e){}
  if(tab==="prod")repCtl?repCtl.refresh():repCtl=Reports.mount("prodRep","brush");
}
function filtered(){
  const f=document.getElementById("f-from").value,t=document.getElementById("f-to").value,
        i=document.getElementById("f-item").value,w=document.getElementById("f-wk").value,
        sh=document.getElementById("f-sh").value,ty=document.getElementById("f-ty").value;
  return rows.filter(r=>(!f||r.d>=f)&&(!t||r.d<=t)
    &&(!i||(i==="__none"?!r.item:r.item===i))
    &&(!w||(w==="__none"?!r.w:r.w===w))
    &&(!sh||r.sh===sh)
    &&(!ty||(ty==="order"?!!r.oid:!r.oid))
    &&hit(Q,r.item,r.w,r.n,r.sh,oLab(ordOf(r.oid))));
}
const canRow=r=>canEditEntry({date:r.d,by:r.by});
const canDel=r=>can("delete")||(!can("edit")&&canRow(r));
const dash='<span class="nums">—</span>';
function draw(){
  const rs=filtered(),sum=rs.reduce((a,r)=>a+r.qty,0),scr=rs.reduce((a,r)=>a+r.sc,0);
  document.getElementById("total").textContent="إجمالي الإنتاج: "+nf(sum)+(scr?" · هالك الجودة: "+nf(scr)+" (نسبة الهالك من الإجمالي "+(Math.round(scr/(sum+scr)*1000)/10)+"%)":"");
  const wm=new Map();rs.forEach(r=>{if(!r.w)return;const o=wm.get(r.w)||{q:0,s:0};o.q+=r.qty;o.s+=r.sc;wm.set(r.w,o)});
  const wl=[...wm.entries()].filter(([,o])=>o.s>0).sort((a,b)=>b[1].s-a[1].s);
  document.getElementById("wq").innerHTML=wl.length?`<table><thead><tr><th>العامل</th><th>السليم</th><th>الهالك</th><th>نسبة الهالك</th></tr></thead><tbody>${wl.map(([n,o])=>`<tr><td><b>${esc(n)}</b></td><td>${nf(o.q)}</td><td><b style="color:var(--bad,#b3261e)">${nf(o.s)}</b></td><td>${Math.round(o.s/(o.q+o.s)*1000)/10}%</td></tr>`).join("")}</tbody></table>`:"";
  const by={};rs.forEach(r=>{const k=r.item||NONE;by[k]=(by[k]||0)+r.qty});
  document.getElementById("brk").textContent=Object.keys(by).length>1?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+": "+nf(v)).join(" · "):"";
  document.getElementById("body").innerHTML=rs.length?rs.map(r=>{const o=ordOf(r.oid);return `<tr><td>${fmtD(r.d)}</td><td>${r.sh?esc(r.sh):dash}</td><td>${r.item?esc(r.item):'<span class="nums">'+NONE+'</span>'}</td><td>${r.isw?'<span class="tag late">هالك جودة</span>':r.oid?esc(o?oLab(o):"#"+r.oid):'<span class="nums">بدون طلبية</span>'}</td><td>${r.w?esc(r.w):dash}</td><td>${r.isw?dash:"<b>"+nf(r.qty)+"</b>"+((r.mo!=null||r.po!=null)?'<div class="nums">'+(r.mo!=null?"قوالب "+nf(r.mo):"")+(r.mo!=null&&r.po!=null?" · ":"")+(r.po!=null?"صبات "+nf(r.po):"")+"</div>":"")}</td><td>${r.sc?'<b style="color:var(--bad,#b3261e)">'+nf(r.sc)+'</b>':dash}</td><td>${r.n?esc(r.n):dash}</td><td class="noprint" style="white-space:nowrap">${canRow(r)?`<button class="btn ghost sm" onclick="castForm(${r.id})">تعديل</button> `:""}${canDel(r)?`<button class="btn ghost sm" onclick="del(${r.id})">حذف</button>`:""}</td></tr>`}).join(""):'<tr><td colspan="9" class="empty">مفيش إنتاج مسجل</td></tr>';
}

/* ===== نموذج تسجيل الإنتاج: بطلبية / بدون طلبية ===== */
function orderProg(o){
  let done=0,scrap=0;rows.forEach(r=>{if(r.oid===o.id){done+=r.qty;scrap+=r.sc}});
  return{done,scrap,rem:Math.max(0,o.req-done)};
}
function castForm(id,presetOid,waste){if(roBlock())return;
  const rec=id?rows.find(r=>r.id===id):null;
  if(rec&&rec.isw)waste=true; // هالك الجودة بيتسجل منفصل بعد مراجعة الجودة، مش مع الطلبيات
  const legacySc=!waste&&rec&&rec.sc>0;
  if(rec&&!canRow(rec)){toast("التعديل مقفول — تقدر تعدّل تسجيلاتك انت في نفس اليوم بس");return}
  wkLoad();
  const openOrds=orders.filter(o=>(o.st==="open"&&orderProg(o).rem>0)||(rec&&rec.oid===o.id)||o.id===presetOid);
  const startOrd=rec?!!rec.oid:!!presetOid;
  const curO=rec?rec.oid:presetOid||null;
  const items=[...new Set([...rows.map(r=>r.item),...orders.map(o=>o.item)].filter(Boolean))];
  const lockDate=!can("edit"); // مسجّل الإنتاج: التسجيل بتاريخ النهارده بس
  const shiftDef=rec?rec.sh:lastShift();
  const modeSel=(ordersOk&&!waste)?`<label>نوع التسجيل</label><select id="m-mode">${rec?"":`<option value="auto" ${startOrd?"":"selected"}>تلقائي (يرتبط بالطلبيات حسب الصنف)</option>`}<option value="order" ${startOrd?"selected":""}>بطلبية</option><option value="free" ${startOrd||!rec?"":"selected"}>بدون طلبية</option></select><div class="nums" id="m-ah" style="margin:4px 0 0"></div>
    <div id="m-ow" style="display:${startOrd?"block":"none"}"><label>الطلبية</label><select id="m-o"><option value="">— اختار الطلبية —</option>${openOrds.map(o=>`<option value="${o.id}" ${o.id===curO?"selected":""}>${esc(oLab(o))}</option>`).join("")}</select><div class="nums" id="m-hint" style="margin:4px 0 0"></div></div>`:"";
  let mx=null;
  openModal(waste?(rec?"تعديل هالك جودة":"تسجيل هالك جودة"):(rec?"تعديل تسجيل":"تسجيل إنتاج"),`${modeSel}
    <label>التاريخ</label><input type="date" id="m-d" value="${rec?rec.d:today()}" ${lockDate?"disabled":""}>
    <label>الوردية</label><select id="m-sh">${SHIFTS.map(s=>`<option ${s===shiftDef?"selected":""}>${s}</option>`).join("")}</select>
    ${XW(true)}
    <label>الصنف</label><input id="m-item" list="m-items" value="${rec?esc(rec.item):""}" maxlength="120"><datalist id="m-items">${items.map(i=>`<option value="${esc(i)}">`).join("")}</datalist>
    ${waste?`<label>عدد القطع الهالكة</label><input type="number" id="m-scrap" min="1" max="100000" inputmode="numeric" value="${rec&&rec.sc?rec.sc:""}"><div class="nums" id="m-wh" style="margin:4px 0 0"></div>`
      :`<label>عدد القطع</label><input type="number" id="m-q" min="${legacySc?0:1}" max="100000" inputmode="numeric" value="${rec?rec.qty:""}">${legacySc?`<label>هالك الجودة (تسجيل قديم)</label><input type="number" id="m-scrap" min="0" max="100000" inputmode="numeric" value="${rec.sc}">`:""}${brcHtml(rec)}${rec?"":CM.html()}`}
    <label>${waste?"السبب / ملاحظات (اختياري)":"ملاحظات (اختياري)"}</label><input id="m-n" maxlength="300" placeholder="أي تعليق على الشغل" value="${rec?esc(rec.n):""}">`,async()=>{
    const mode=(ordersOk&&!waste)?document.getElementById("m-mode").value:"free";
    const oid=mode==="order"?parseInt(document.getElementById("m-o").value)||null:null;
    if(mode==="order"&&!oid){toast("اختار الطلبية");return false}
    const qe=document.getElementById("m-q"),se=document.getElementById("m-scrap");
    const q=qe?(parseInt(qe.value)||0):0,sc=se?(parseInt(se.value)||0):0;
    if(waste?sc<1:(q<0||sc<0||q+sc<1||(!legacySc&&q<1))){toast(waste?"اكتب عدد القطع الهالكة":"اكتب عدد القطع");return false}
    const item=document.getElementById("m-item").value.trim();
    if(!item){toast("اكتب اسم الصنف");return false}
    const sh=document.getElementById("m-sh").value,x=xfRead();
    if(!x.worker){toast(waste?"اختار العامل اللي طلع منه الهالك":"اختار اسم العامل");return false}
    const free=mode!=="order",auto=mode==="auto"&&!rec;
    let extra=[];
    if(!waste&&!rec&&mx){
      for(const e of mx.read()){
        if(!e.qty&&!e.item&&!e.oid)continue;
        const it2=free?e.item:((ordOf(e.oid)||{}).item||"");
        if(e.qty<1||!it2||(!free&&!e.oid)){toast("كمّل بيانات الأصناف الإضافية (الصنف أو الطلبية وعدد القطع)");return false}
        extra.push({oid:free?null:e.oid,item:it2,qty:e.qty,molds:e.molds,pours:e.pours});
      }
    }
    const cd=lockDate?(rec?rec.d:today()):(document.getElementById("m-d").value||today());
    // ربط الهالك بإجمالي إنتاج الصنف في نفس اليوم، بغض النظر عن العامل أو الوردية.
    // يُحفظ الهالك كسجل مستقل مرتبط منطقيًا بالصنف/التاريخ حتى لا ننسبه عشوائيًا لعامل إنتاج آخر.
    if(waste&&!rec){
      const dayRows=rows.filter(r=>!r.isw&&r.d===cd&&norm(r.item)===norm(item));
      const good=dayRows.reduce((n,r)=>n+(+r.qty||0),0);
      if(!dayRows.length||good<=0){toast("لا يوجد إنتاج سليم مسجل لهذا الصنف اليوم. سجّل الإنتاج أولًا ثم أضف الهالك.","bad");return false}
      if(!await reviewSave({title:"راجع الهالك قبل الحفظ",meta:[["التاريخ",fmtD(cd)],["الصنف",item],["إجمالي السليم اليوم",nf(good)],["العامل المسجل للهالك",x.worker]],items:[{title:item,rows:[["إجمالي السليم اليوم",nf(good)],["عدد القطع الهالكة",nf(sc)]]}]}))return false;
      const wasteRow={brush_date:cd,item,qty:0,scrap:sc,shift:sh,worker:x.worker||null,note:x.note||null,order_id:null};
      const saved=await castInsert(wasteRow,"brush_log","brush");
      if(saved.queued){try{localStorage.setItem("brush_shift",sh)}catch(e){}toast("الهالك اتحفظ على الجهاز وسيتزامن عند عودة الإنترنت","warn");return}

    const brx=(!waste&&true&&!rec)?(()=>{const b=brcRead(),o={};if(b.molds!=null)o.molds=b.molds;if(b.pours!=null)o.pours=b.pours;return o})():{},exb=e=>{const o={};if(e.molds!=null)o.molds=e.molds;if(e.pours!=null)o.pours=e.pours;return o};

    const used=new Map();

      items:(ents||[{item,qty:waste?sc:q,order_id:oid}]).map(e=>{const o=e.order_id?ordOf(e.order_id):null;
        const rows=[[waste?"عدد القطع الهالكة":"عدد القطع",nf(waste?sc:e.qty)],["الطلبية",o?oLab(o):"بدون طلبية"]];if(e.molds!=null)rows.push(["عدد القوالب",nf(e.molds)]);if(e.pours!=null)rows.push(["عدد الصبات",nf(e.pours)]);let warn="";
        if(o){const base=Math.max(orderProg(o).rem-pendQ(o.id),0)+(rec&&rec.oid===o.id?rec.qty:0),u=(used.get(o.id)||0)+e.qty;used.set(o.id,u);rows.push(["المتبقي بعد التسجيل",remAfter(base,u)]);warn=overWarn(base,u)}
        return{title:e.item,rows,warn}})}))return false;
    const row={brush_date:cd,item,qty:q,scrap:sc,shift:sh,worker:x.worker||null,note:x.note||null,order_id:oid};
    if(!waste&&rec){const b=brcRead();if(b.molds!=null||b.pours!=null||(rec&&(rec.mo!=null||rec.po!=null))){row.molds=b.molds;row.pours=b.pours}}
    if(!se&&rec)delete row.scrap; // نموذج الإنتاج ما بيلمسش الهالك
    if(!rec){
      const linked=ents.filter(e=>e.order_id).length;
      let ok=0,qd=0,err=null;

      try{localStorage.setItem("cast_shift",sh)}catch(e){}
      if(err){
        const m=BRC_ERR.test(err.message||"")?"شغّل ملف setup_v4_4.sql من Supabase الأول":V2_ERR.test(err.message||"")?"شغّل ملف setup_brush.sql من Supabase الأول":"خطأ: "+err.message;
        if(!ok&&!qd){toast(m,"bad");return false}

      }
      await load();
      toast(qd?"مفيش نت: اتحفظ على الجهاز وهيتسجل لوحده لما النت يرجع":(auto?(linked?"تم التسجيل وربطه تلقائيًا بالطلبية":"تم التسجيل (مفيش طلبية مفتوحة للصنف ده)"):(ok>1?"تم تسجيل "+ok+" أصناف":"تم التسجيل")),qd?"warn":undefined);return;
    }
    const res=rec?await db.from("brush_log").update(row).eq("id",id):await castInsert(row,"brush_log","brush");
    if(res.queued){try{localStorage.setItem("cast_shift",sh)}catch(e){}toast("مفيش نت: اتحفظ على الجهاز وهيتسجل لوحده لما النت يرجع","warn");return}
    const error=res.error;
    if(error){toast(BRC_ERR.test(error.message||"")?"شغّل ملف setup_v4_4.sql من Supabase الأول":V2_ERR.test(error.message||"")?"شغّل ملف setup_brush.sql من Supabase الأول":"خطأ: "+error.message);return false}
    try{localStorage.setItem("cast_shift",sh)}catch(e){}

  });
  setTimeout(()=>{

      const h=document.getElementById("m-wh"),dEl=document.getElementById("m-d"),sEl=document.getElementById("m-scrap"),itemEl=document.getElementById("m-item");
      const upd=()=>{const it=itemEl.value.trim();if(!it){h.textContent="اكتب الصنف لعرض إجمالي إنتاجه اليوم";return}
        const mine=rows.filter(r=>norm(r.item)===norm(it)&&r.d===dEl.value&&(!rec||r.id!==rec.id)),g=mine.reduce((a,r)=>a+r.qty,0),s=mine.reduce((a,r)=>a+r.sc,0)+(parseInt(sEl.value)||0);
        h.textContent="إجمالي سليم الصنف اليوم: "+nf(g)+" · الهالك: "+nf(s)+" · نسبة الهالك: "+(g+s?Math.round(s/(g+s)*1000)/10:0)+"%"};

    if(!mode)return;
    const sel=document.getElementById("m-o"),item=document.getElementById("m-item"),hint=document.getElementById("m-hint");

          else{const qv=parseInt((document.getElementById("m-q")||{}).value)||1,sp=castAutoSplit([{item:it,qty:qv}],orders.filter(x=>x.st==="open").map(x=>({id:x.id,item:x.item,rem:orderProg(x).rem-pendQ(x.id),due:x.due,date:x.od}))).filter(e=>e.order_id);
            ah.textContent=sp.length?"هيتربط بـ: "+sp.map(e=>oLab(ordOf(e.order_id))).join(" + "):"مفيش طلبية مفتوحة للصنف ده — هيتسجل بدون طلبية"}}
      }
      if(mx)mx.mode();
    };
    item.addEventListener("input",sync);const qIn=document.getElementById("m-q");if(qIn)qIn.addEventListener("input",sync);

  },0);

async function del(id){
  const rec=rows.find(r=>r.id===id);
  if(rec&&!canDel(rec)){toast("الحذف مش متاح لك");return}
  if(!await ask("حذف السجل ده؟"))return;
  const{data:dd,error}=await db.from("brush_log").delete().eq("id",id).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  await load();toast("تم الحذف");
}
