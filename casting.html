<script>try{var n=performance.getEntriesByType("navigation")[0];if(sessionStorage.getItem("sp")&&!(n&&n.type==="reload"))document.getElementById("splash").remove()}catch(e){}</script>
<div class="wrap">
  <h1>الصب اليدوي</h1>
  <div class="tabs noprint"><button class="btn on" id="t-log">السجل</button><button class="btn ghost" id="t-ord">الطلبيات</button><button class="btn ghost" id="t-prod">تقارير</button></div>
  <div id="logView">
  <div class="kpis mini three" id="stats"></div>
  <button class="btn noprint" id="add" style="width:100%;margin-bottom:12px">+ تسجيل إنتاج</button>
  <div class="card noprint">
    <div class="two"><div><label>من</label><input type="date" id="f-from"></div><div><label>إلى</label><input type="date" id="f-to"></div></div>
    <div class="two"><div><label>الصنف</label><select id="f-item"><option value="">الكل</option></select></div><div><label>العامل</label><select id="f-wk"><option value="">الكل</option></select></div></div>
    <div class="two"><div><label>الوردية</label><select id="f-sh"><option value="">الكل</option><option>صباحي</option><option>مسائي</option><option>ليلي</option></select></div><div><label>النوع</label><select id="f-ty"><option value="">الكل</option><option value="order">بطلبية</option><option value="free">بدون طلبية</option></select></div></div>
    <div class="row"><button class="btn" id="f-go">عرض</button><button class="btn ghost" id="f-csv">تصدير Excel</button><button class="btn ghost" onclick="window.print()">طباعة</button></div>
  </div>
  <div class="total" id="total"></div>
  <div class="nums" id="brk" style="margin-bottom:10px"></div>
  <div class="scroll" id="tbl"><table><thead><tr><th>التاريخ</th><th>الوردية</th><th>الصنف</th><th>الطلبية</th><th>العامل</th><th>القطع</th><th>هالك الجودة</th><th>ملاحظات</th><th class="noprint"></th></tr></thead><tbody id="body"></tbody></table></div>
  </div>
  <div id="ordView" style="display:none">
    <a class="btn ghost noprint" id="addo" href="orders.html" style="display:none;width:100%;margin-bottom:12px;text-align:center">إضافة / تعديل الطلبيات من صفحة الطلبيات</a>
    <div class="row noprint" style="margin-bottom:10px"><button class="btn sm" id="o-open">المفتوحة</button><button class="btn ghost sm" id="o-closed">المكتملة</button></div>
    <div id="ordList"></div>
  </div>
  <div id="prodRep" style="display:none"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="reports.js"></script>
<script>
let rows=[],orders=[],ordersOk=false,Q="",repCtl=null,oFilter="open",
    tab=location.hash==="#reports"?"prod":(location.hash==="#orders"||location.hash==="#open")?"ord":"log";
const NONE="بدون صنف",SHIFTS=["صباحي","مسائي","ليلي"],V2_ERR=/shift|scrap|order_id|casting_orders|schema cache/i;
const ordOf=id=>orders.find(o=>o.id===id)||null;
const oLab=o=>o?((o.no?"#"+o.no:"")+(o.no?" · ":"")+(o.title?o.title+" — ":"")+o.item):"";
const lastShift=()=>{try{return localStorage.getItem("cast_shift")||""}catch(e){return ""}};

async function load(){
  const[a,b,gr]=await Promise.all([
    db.from("casting_log").select("*").order("casting_date",{ascending:false}).order("id",{ascending:false}),
    db.from("casting_orders").select("*").order("id",{ascending:false}),
    db.from("order_groups").select("id,title,order_no")]);
  const GM=new Map(((gr&&gr.data)||[]).map(x=>[x.id,x]));
  if(a.error){
    if(/casting_log|relation|schema cache|does not exist/i.test(a.error.message||"")){
      document.getElementById("body").innerHTML='<tr><td colspan="9" class="empty err-state">جدول الصب اليدوي غير موجود. شغّل ملف setup_casting.sql ثم setup_casting_v2.sql من Supabase (SQL Editor) مرة واحدة.<br><button class="btn sm" onclick="load()">إعادة المحاولة</button></td></tr>';return}
    fail("body",load);return}
  ordersOk=!b.error;
  orders=ordersOk?(b.data||[]).map(o=>{const g=GM.get(o.group_id);return{id:o.id,gid:o.group_id||null,title:g?(g.title||"").trim():(o.title||""),no:g&&g.order_no||null,item:o.item,req:o.qty_required,od:o.order_date,due:o.due_date||"",st:o.status,n:o.note||""}}):[];
  rows=a.data.map(r=>({id:r.id,d:r.casting_date,item:r.item||"",qty:r.qty,sc:r.scrap||0,sh:r.shift||"",oid:r.order_id||null,w:r.worker||"",n:r.note||"",by:r.created_by||null}));
  fillSel("f-item",[...new Set(rows.map(r=>r.item).filter(Boolean))],'<option value="__none">'+NONE+'</option>');
  fillSel("f-wk",[...new Set(rows.map(r=>r.w).filter(Boolean))],'<option value="__none">بدون عامل</option>');
  draw();drawStats();drawOrders();
  document.getElementById("t-ord").style.display=ordersOk?"":"none";
}
function fillSel(id,vals,extra){
  const s=document.getElementById(id),cur=s.value;
  s.innerHTML='<option value="">الكل</option>'+(extra||"")+vals.sort((a,b)=>a.localeCompare(b,"ar")).map(v=>`<option>${esc(v)}</option>`).join("");
  s.value=cur;
}
function drawStats(){
  const t=today(),m=t.slice(0,8)+"01";
  const scr=rows.reduce((a,r)=>a+(r.d>=m&&r.d<=t?r.sc:0),0);
  kpis("stats",[["إنتاج النهارده",sumQty(rows,t,t),"var(--ok)"],["هذا الشهر",sumQty(rows,m,t)],["هالك هذا الشهر",scr,scr?"var(--bad,#b3261e)":""]]);
}
function setTab(){
  ["log","ord","prod"].forEach(k=>document.getElementById("t-"+k).className="btn "+(tab===k?"on":"ghost"));
  document.getElementById("logView").style.display=tab==="log"?"block":"none";
  document.getElementById("ordView").style.display=tab==="ord"?"block":"none";
  document.getElementById("prodRep").style.display=tab==="prod"?"block":"none";
  try{history.replaceState(null,"",tab==="prod"?"#reports":tab==="ord"?"#orders":location.pathname+location.search)}catch(e){}
  if(tab==="prod")repCtl?repCtl.refresh():repCtl=Reports.mount("prodRep","casting");
}
function filtered(){
  const f=document.getElementById("f-from").value,t=document.getElementById("f-to").value,
        i=document.getElementById("f-item").value,w=document.getElementById("f-wk").value,
        sh=document.getElementById("f-sh").value,ty=document.getElementById("f-ty").value;
  return rows.filter(r=>(!f||r.d>=f)&&(!t||r.d<=t)
    &&(!i||(i==="__none"?!r.item:r.item===i))
    &&(!w||(w==="__none"?!r.w:r.w===w))
    &&(!sh||r.sh===sh)
    &&(!ty||(ty==="order"?!!r.oid:!r.oid))
    &&hit(Q,r.item,r.w,r.n,r.sh,oLab(ordOf(r.oid))));
}
const canRow=r=>canEditEntry({date:r.d,by:r.by});
const canDel=r=>can("delete")||(!can("edit")&&canRow(r));
const dash='<span class="nums">—</span>';
function draw(){
  const rs=filtered(),sum=rs.reduce((a,r)=>a+r.qty,0),scr=rs.reduce((a,r)=>a+r.sc,0);
  document.getElementById("total").textContent="إجمالي الإنتاج: "+nf(sum)+(scr?" · هالك الجودة: "+nf(scr)+" ("+(Math.round(scr/(sum+scr)*1000)/10)+"%)":"");
  const by={};rs.forEach(r=>{const k=r.item||NONE;by[k]=(by[k]||0)+r.qty});
  document.getElementById("brk").textContent=Object.keys(by).length>1?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+": "+nf(v)).join(" · "):"";
  document.getElementById("body").innerHTML=rs.length?rs.map(r=>{const o=ordOf(r.oid);return `<tr><td>${fmtD(r.d)}</td><td>${r.sh?esc(r.sh):dash}</td><td>${r.item?esc(r.item):'<span class="nums">'+NONE+'</span>'}</td><td>${r.oid?esc(o?oLab(o):"#"+r.oid):'<span class="nums">بدون طلبية</span>'}</td><td>${r.w?esc(r.w):dash}</td><td><b>${nf(r.qty)}</b></td><td>${r.sc?'<b style="color:var(--bad,#b3261e)">'+nf(r.sc)+'</b>':dash}</td><td>${r.n?esc(r.n):dash}</td><td class="noprint" style="white-space:nowrap">${canRow(r)?`<button class="btn ghost sm" onclick="form(${r.id})">تعديل</button> `:""}${canDel(r)?`<button class="btn ghost sm" onclick="del(${r.id})">حذف</button>`:""}</td></tr>`}).join(""):'<tr><td colspan="9" class="empty">مفيش إنتاج مسجل</td></tr>';
}

/* ===== نموذج تسجيل الإنتاج: بطلبية / بدون طلبية ===== */
function orderProg(o){
  let done=0,scrap=0;rows.forEach(r=>{if(r.oid===o.id){done+=r.qty;scrap+=r.sc}});
  return{done,scrap,rem:Math.max(0,o.req-done)};
}
function form(id,presetOid){
  const rec=id?rows.find(r=>r.id===id):null;
  if(rec&&!canRow(rec)){toast("التعديل مقفول — تقدر تعدّل تسجيلاتك انت في نفس اليوم بس");return}
  wkLoad();
  const openOrds=orders.filter(o=>(o.st==="open"&&orderProg(o).rem>0)||(rec&&rec.oid===o.id)||o.id===presetOid);
  const startOrd=rec?!!rec.oid:(presetOid?true:openOrds.length>0);
  const curO=rec?rec.oid:presetOid||null;
  const items=[...new Set(rows.map(r=>r.item).filter(Boolean))];
  const lockDate=!can("edit"); // مسجّل الإنتاج: التسجيل بتاريخ النهارده بس
  const shiftDef=rec?rec.sh:lastShift();
  const modeSel=ordersOk?`<label>نوع التسجيل</label><select id="m-mode"><option value="order" ${startOrd?"selected":""}>بطلبية</option><option value="free" ${startOrd?"":"selected"}>بدون طلبية</option></select>
    <div id="m-ow" style="display:${startOrd?"block":"none"}"><label>الطلبية</label><select id="m-o"><option value="">— اختار الطلبية —</option>${openOrds.map(o=>`<option value="${o.id}" ${o.id===curO?"selected":""}>${esc(oLab(o))}</option>`).join("")}</select><div class="nums" id="m-hint" style="margin:4px 0 0"></div></div>`:"";
  openModal(rec?"تعديل تسجيل":"تسجيل إنتاج",`${modeSel}
    <label>التاريخ</label><input type="date" id="m-d" value="${rec?rec.d:today()}" ${lockDate?"disabled":""}>
    <label>الوردية</label><select id="m-sh">${SHIFTS.map(s=>`<option ${s===shiftDef?"selected":""}>${s}</option>`).join("")}</select>
    ${XW(true)}
    <label>الصنف</label><input id="m-item" list="m-items" value="${rec?esc(rec.item):""}" maxlength="120"><datalist id="m-items">${items.map(i=>`<option value="${esc(i)}">`).join("")}</datalist>
    <label>عدد القطع</label><input type="number" id="m-q" min="0" max="100000" inputmode="numeric" value="${rec?rec.qty:""}">
    <label>هالك الجودة (اختياري)</label><input type="number" id="m-sc" min="0" max="100000" inputmode="numeric" placeholder="0" value="${rec&&rec.sc?rec.sc:""}">
    <label>ملاحظات (اختياري)</label><input id="m-n" maxlength="300" placeholder="أي تعليق على الشغل" value="${rec?esc(rec.n):""}">`,async()=>{
    const mode=ordersOk?document.getElementById("m-mode").value:"free";
    const oid=mode==="order"?parseInt(document.getElementById("m-o").value)||null:null;
    if(mode==="order"&&!oid){toast("اختار الطلبية");return false}
    const q=parseInt(document.getElementById("m-q").value)||0,sc=parseInt(document.getElementById("m-sc").value)||0;
    if(q<0||sc<0||q+sc<1){toast("اكتب عدد القطع أو الهالك");return false}
    const item=document.getElementById("m-item").value.trim();
    if(!item){toast("اكتب اسم الصنف");return false}
    const sh=document.getElementById("m-sh").value,x=xfRead();
    if(!x.worker){toast("اكتب اسم العامل");return false}
    if(oid){const o=ordOf(oid),p=o&&orderProg(o);
      const rem=o?p.rem+(rec&&rec.oid===oid?rec.qty:0):0;
      if(o&&q>rem&&!await ask("العدد ("+nf(q)+") أكبر من المتبقي في الطلبية ("+nf(rem)+"). تسجّله برضو؟","نعم، سجّل"))return false}
    const row={casting_date:lockDate?(rec?rec.d:today()):(document.getElementById("m-d").value||today()),item,qty:q,scrap:sc,shift:sh,worker:x.worker,note:x.note||null,order_id:oid};
    const{error}=rec?await db.from("casting_log").update(row).eq("id",id):await db.from("casting_log").insert(row);
    if(error){toast(V2_ERR.test(error.message||"")?"شغّل ملف setup_casting_v2.sql من Supabase الأول":"خطأ: "+error.message);return false}
    try{localStorage.setItem("cast_shift",sh)}catch(e){}
    await load();toast(rec?"تم التعديل":"تم التسجيل");
  });
  setTimeout(()=>{
    const w=document.getElementById("m-w");if(w&&rec)w.value=rec.w;
    const mode=document.getElementById("m-mode");if(!mode)return;
    const sel=document.getElementById("m-o"),item=document.getElementById("m-item"),hint=document.getElementById("m-hint");
    const sync=()=>{
      const isO=mode.value==="order";
      document.getElementById("m-ow").style.display=isO?"block":"none";
      const o=isO?ordOf(parseInt(sel.value)):null;
      item.readOnly=!!o;
      if(o){item.value=o.item;const p=orderProg(o);hint.textContent="مطلوب "+nf(o.req)+" · اتعمل "+nf(p.done)+" · متبقي "+nf(p.rem)+(o.due?" · التسليم "+fmtD(o.due):"")}
      else hint.textContent="";
    };
    mode.onchange=sync;sel.onchange=sync;sync();
  },0);
}
async function del(id){
  const rec=rows.find(r=>r.id===id);
  if(rec&&!canDel(rec)){toast("الحذف مش متاح لك");return}
  if(!await ask("حذف السجل ده؟"))return;
  const{data:dd,error}=await db.from("casting_log").delete().eq("id",id).select();
  if(error||!dd.length){toast(error?"خطأ: "+error.message:"لم يتم الحذف، راجع الصلاحيات");return}
  await load();toast("تم الحذف");
}

/* ===== الطلبيات ===== */
function drawOrders(){
  const el=document.getElementById("ordList");if(!el)return;
  document.getElementById("addo").style.display=can("edit")?"block":"none";
  document.getElementById("o-open").className="btn sm"+(oFilter==="open"?"":" ghost");
  document.getElementById("o-closed").className="btn sm"+(oFilter==="closed"?"":" ghost");
  const isOpen=o=>o.st==="open"&&orderProg(o).rem>0,list=orders.filter(o=>(oFilter==="open")===isOpen(o));
  el.innerHTML=list.length?list.map(o=>{
    const p=orderProg(o),pc=Math.min(100,Math.round(p.done/o.req*100));
    return `<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(oLab(o))}</b><span class="nums">${pc}%</span></div>
    <div style="height:8px;border-radius:6px;background:rgba(128,128,128,.25);margin:8px 0;overflow:hidden"><div style="height:100%;width:${pc}%;background:var(--ok)"></div></div>
    <div class="nums">مطلوب ${nf(o.req)} · اتعمل ${nf(p.done)} · متبقي ${nf(p.rem)}${p.scrap?" · هالك "+nf(p.scrap):""}${o.due?" · التسليم "+fmtD(o.due):""}</div>
    ${o.n?`<div class="nums" style="margin-top:4px">${esc(o.n)}</div>`:""}
    <div class="row noprint" style="margin-top:10px">${isOpen(o)?`<button class="btn sm" onclick="form(0,${o.id})">سجّل إنتاج</button>`:""}</div></div>`}).join("")
    :'<div class="empty">'+(oFilter==="open"?"مفيش طلبيات صب مفتوحة. الطلبيات بتتوزّع على الصب من صفحة الطلبيات.":"مفيش طلبيات مكتملة")+'</div>';
}
function exportCsv(){
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv="\uFEFF"+["التاريخ,الوردية,الصنف,الطلبية,العامل,عدد القطع,هالك الجودة,ملاحظات",...filtered().map(r=>[r.d,r.sh,r.item||NONE,r.oid?oLab(ordOf(r.oid))||"#"+r.oid:"بدون طلبية",r.w,r.qty,r.sc,r.n].map(q).join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="الصب-اليدوي.csv";a.click();
}
document.getElementById("add").onclick=()=>form(0);
document.getElementById("f-go").onclick=draw;
document.getElementById("f-csv").onclick=exportCsv;
document.getElementById("o-open").onclick=()=>{oFilter="open";drawOrders()};
document.getElementById("o-closed").onclick=()=>{oFilter="closed";drawOrders()};
["log","ord","prod"].forEach(k=>document.getElementById("t-"+k).onclick=()=>{tab=k;setTab()});
(async()=>{if(await requireAuth("casting.html")){renderNav("casting.html");searchBox("tbl",q=>{Q=q;draw()},"بحث بالصنف أو العامل أو الطلبية…");dateChips("f-from","f-to",draw);skel("body",4);if(tab!=="log")setTab();load().finally(settle)}})();
</script>
<script src="install.js" defer></script>
</body>
