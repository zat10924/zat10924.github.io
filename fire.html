<style>
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;border-inline-start:5px solid var(--fcol,var(--line))}
.fc.in_kiln{--fcol:#C0502B}.fc.preparing{--fcol:#B8862B}.fc.done,.fc.approved{--fcol:var(--ok)}.fc.draft{--fcol:#B8862B}
.fh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.fh b{font-size:1.05rem}
.fm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;margin:8px 0;font-size:.88rem;color:var(--ink2,var(--mute))}
.fm span b{color:var(--ink,inherit);font-weight:700}
.ftb{width:100%;border-collapse:collapse;margin:8px 0;font-size:.9rem}
.ftb th{font-weight:700;color:var(--mute);text-align:start;padding:5px 6px;border-bottom:1px solid var(--line)}
.ftb td{padding:6px;border-bottom:1px dashed var(--line)}
.ftb tfoot td{font-weight:800;border-bottom:0}
.fb{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fb .btn{flex:1 1 130px}
.fb .big{flex:1 1 100%;min-height:52px;font-size:1.05rem}
.fst{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 11px;border-radius:99px;color:#fff;background:var(--mute)}
.fst.in_kiln{background:#C0502B}.fst.preparing,.fst.draft{background:#B8862B}.fst.done,.fst.approved{background:var(--ok)}
.fw{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:10px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);font-size:.82rem;font-weight:700}
.krow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
.pf{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.pf.old{opacity:.55}
.pf img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#0002;cursor:zoom-in}
.pf .pc{padding:6px 8px;font-size:.8rem;line-height:1.5}
.pf .pc b{display:block;font-size:.88rem}
.pf .pc .btn{margin-top:4px;min-height:32px;padding:2px 10px;font-size:.8rem}
.pt{display:inline-block;font-size:.72rem;padding:0 8px;border-radius:99px;background:color-mix(in srgb,var(--mute) 18%,transparent);margin-inline-start:4px}
.lbx{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:10px}
.lbx img{max-width:100%;max-height:100%;object-fit:contain}
.fsp{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:fspin .7s linear infinite;vertical-align:-2px;margin-inline-end:6px}
@keyframes fspin{to{transform:rotate(360deg)}}
.irow{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.irow .two{align-items:end}
@media(min-width:760px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.fm{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media print{.fb,.noprint{display:none!important}.fc{break-inside:avoid;box-shadow:none}}

.fseg{display:flex;gap:4px;padding:4px;border-radius:14px;background:color-mix(in srgb,var(--mute) 12%,transparent);margin:0 0 12px}
.fseg button{flex:1;border:0;background:transparent;color:var(--ink2,var(--mute));font:inherit;font-weight:700;padding:10px 8px;border-radius:11px;cursor:pointer;min-height:44px}
.fseg button.on{background:var(--card);color:var(--ink,inherit);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.fseg button[data-k=biscuit].on{box-shadow:0 2px 8px rgba(138,90,60,.3);color:#8A5A3C}
.fseg button[data-k=glaze].on{box-shadow:0 2px 8px rgba(46,111,128,.3);color:#2E6F80}
.fsec{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-size:1.02rem}
.fsec:before{content:"";width:5px;height:20px;border-radius:3px;background:var(--fire,#C0502B)}
.fsec .sp{flex:1}
.kcards{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 12px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;border-top:4px solid var(--kc)}
.kcard.biscuit{--kc:#8A5A3C}.kcard.glaze{--kc:#2E6F80}
.kcard .kh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;color:var(--kc);margin-bottom:10px}
.kcard .kst{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.kcard .kst div{text-align:center;padding:8px 2px;border-radius:12px;background:color-mix(in srgb,var(--kc) 8%,transparent)}
.kcard .kst b{display:block;font-size:1.3rem;line-height:1.2}
.kcard .kst small{display:block;font-size:.72rem;color:var(--mute);line-height:1.3}
.kcard .ka{display:flex;gap:8px}
.kcard .ka .btn{flex:1;min-height:46px}
.fal{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;margin:0 0 12px;background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);font-weight:700}
.fal svg{width:20px;height:20px;flex:none}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kln{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;border-inline-start:5px solid var(--kcol,var(--line))}
.kln.busy{--kcol:#C0502B}.kln.free{--kcol:var(--ok)}.kln.off{--kcol:var(--mute);opacity:.65}
.kln b{display:block;margin-bottom:4px}
.kln .nums{margin-top:4px}
@media(min-width:760px){.kcards{grid-template-columns:1fr 1fr}.kgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rpv{position:fixed;inset:0;z-index:120;background:#3a3a3e;display:flex;flex-direction:column}
.rpv-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);padding-top:max(10px,env(safe-area-inset-top))}
.rpv-bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpv-fr{flex:1;width:100%;border:0;background:#e9e9ec}

/* ===== 4.6: تبويبات، لوحة، تقارير ===== */
#ftabs{display:block;margin:8px 0;padding:8px;background:var(--card);border:1px solid var(--line,#0002);border-radius:14px}
#ftabs .ftop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
#ftabs .ftop button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;padding:6px 2px;border-radius:14px;font:inherit;font-size:12.5px;font-weight:700;line-height:1.2;text-align:center;cursor:pointer;border:1px solid var(--line,#0002);background:transparent;color:var(--ink2,inherit)}
#ftabs .ftop button .ui{width:22px;height:22px}
#ftabs .ftop button.on{background:var(--pri,#7a2438);color:var(--on-pri,#fff);border-color:transparent}
#ftabs .fsub{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#ftabs .fsub button{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid var(--line,#0002);background:transparent;color:var(--ink2,inherit)}
#ftabs .fsub button .ui{width:17px;height:17px}
#ftabs .fsub button.on{background:var(--pri,#7a2438);color:var(--on-pri,#fff);border-color:transparent}
@media(max-width:340px){#ftabs .ftop button{font-size:11.5px}}
.kpg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 12px}
.kp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px;text-align:center;border-top:4px solid var(--kc,var(--pri));cursor:pointer}
.kp b{display:block;font-size:1.8rem;line-height:1.2;color:var(--kc,var(--pri))}.kp small{display:block;color:var(--mute);font-size:.82rem;line-height:1.4;margin-top:2px}
@media(min-width:760px){.kpg{grid-template-columns:repeat(6,minmax(0,1fr))}}
.chips{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.chips .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 16px;font:inherit;font-weight:700;cursor:pointer;min-height:38px}
.chips .chip.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.ftb.lg{min-width:640px;margin:0}.ftb.lg td,.ftb.lg th{padding:8px 8px;white-space:nowrap}
.ftb.lg tbody tr:hover{background:color-mix(in srgb,var(--pri) 6%,transparent)}
.pt.kk-biscuit{background:color-mix(in srgb,#8A5A3C 22%,transparent);color:#8A5A3C}.pt.kk-glaze{background:color-mix(in srgb,#2E6F80 22%,transparent);color:#2E6F80}.pt.kk-none{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
[data-theme=dark] .pt.kk-biscuit{color:#d9a47f}[data-theme=dark] .pt.kk-glaze{color:#7fc0d3}
.fseg button.on{color:var(--ink)}
.fc.au-insert{--fcol:var(--ok)}.fc.au-update{--fcol:#B8862B}.fc.au-delete{--fcol:var(--bad)}
.adt td.old{color:var(--bad)}.adt td.new{color:var(--ok);font-weight:700}
.rpv-bar .btn{white-space:nowrap}

<script>
/* ===== قسم الحريق والشحن (4.6): الحريق مستقل عن الشحن + تخصصات العمال + سجل مراجعة ===== */
let tab="dash",Q="",K=[],L=[],O=[],OI=[],AUD=[],loaded=false,loadErr="",V2=true;
const KIND={bl:"biscuit",bf:"biscuit",gl:"glaze",gf:"glaze"};
const KAR={biscuit:"بسكوت",glaze:"جليز"};
const LST={draft:"قيد التجهيز",approved:"معتمد"};
const OST={preparing:"قيد التجهيز",in_kiln:"داخل الفرن",done:"مكتملة"};
const TABS=[["dash","لوحة التحكم"],["bf","حريق البسكوت"],["gf","حريق الجليز"],["bl","شحن البسكوت"],["gl","شحن الجليز"],["kil","الأفران"],["run","جارية"],["dn","مكتملة"],["log","السجل"],["prt","التقارير والطباعة"],["prod","تقارير القسم"],["aud","المراجعة"]];
const BUCKET="firing-meters",HOUR=60*60e3;
const CAM='<svg class="ui" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const FLAME='<svg class="ui" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s5 4.5 5 9.5a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-.5-5.5 1-8z"/></svg>';
const PLUS='<svg class="ui" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';

/* ---------- الصلاحيات (نفس منطق السيرفر؛ السيرفر هو اللي بيفرضها فعليًا) ---------- */
const FR=()=>(ME&&ME.fire_role)||"";
const isSup=()=>!!ME&&!isOwner()&&(ME.role==="admin"||((ME.role==="manager"||FR()==="fire_supervisor")&&secList(ME).includes("fire")));
const isMgr=isSup;
// act: "fire" حريق | "ship" شحن
const canDo=(act,kind)=>{if(!ME||isOwner())return false;if(isSup())return true;if(!secList(ME).includes("fire"))return false;const r=FR();return !r||(act==="fire"&&r===kind+"_kiln")||(act==="ship"&&r===kind+"_loader")};
const canEditRec=(r,act)=>!!r&&!!ME&&(isSup()||(r.created_by===ME.id&&canDo(act,r.kind)&&dayOf(r.created_at)===today()));
const canDelRec=()=>isSup();
const canAudit=()=>isSup()||isOwner()||!!(ME&&ME.view_all);

/* ---------- أدوات ---------- */
const Lk=id=>L.find(x=>x.id===id)||null, Kk=id=>K.find(x=>x.id===id)||null;
const itemsOf=l=>((l&&l.firing_load_items)||[]).slice().sort((a,b)=>(a.sort||0)-(b.sort||0)||a.id-b.id);
// أصناف العملية: بتاعتها هي لو متسجلة، وإلا أصناف الشحنة المرتبطة (للسجلات القديمة)
const opItemsOnly=o=>OI.filter(x=>x.op_id===o.id).sort((a,b)=>(a.sort||0)-(b.sort||0)||a.id-b.id);
const opItems=o=>{const own=opItemsOnly(o);if(own.length)return own;return o.load_id?itemsOf(Lk(o.load_id)):[]};
const opTotal=o=>opItems(o).reduce((a,i)=>a+(+i.qty||0),0);
const opCart=o=>o.cart_code||(Lk(o.load_id)||{}).cart_code||"";
const opOfLoad=id=>O.find(o=>o.load_id===id)||null;
const kindOfKiln=k=>k&&k.kind?KAR[k.kind]:"غير محدد";
const kilnLbl=k=>k?k.name+" ("+kindOfKiln(k)+")":"—";
const fmtT=t=>{if(!t)return"—";const d=new Date(t);return isNaN(d)?"—":d.toLocaleString("ar-EG",{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})};
const fmtHM=t=>{const d=new Date(t);return isNaN(d)?"—":d.toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"})};
const localDT=(d=new Date())=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
const dayOf=t=>{if(!t)return"";const d=new Date(t);return isNaN(d)?"":new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const toISO=v=>{if(!v)return null;const d=new Date(v);return isNaN(d)?null:d.toISOString()};
const ago=t=>t?"منذ "+dur(Date.now()-new Date(t).getTime()):"—";
const qtyOf=l=>itemsOf(l).reduce((a,i)=>a+(+i.qty||0),0);
const rowsTbl=(it,tot)=>it.length?`<table class="ftb"><thead><tr><th>الصنف</th><th>الكمية</th></tr></thead><tbody>${it.map(i=>`<tr><td>${esc(i.item)}</td><td><b>${nf(i.qty)}</b></td></tr>`).join("")}</tbody><tfoot><tr><td>الإجمالي</td><td>${nf(tot!=null?tot:it.reduce((a,i)=>a+(+i.qty||0),0))}</td></tr></tfoot></table>`:'<div class="nums">مفيش أصناف مسجّلة</div>';
const itemsTbl=l=>rowsTbl(itemsOf(l),l&&(l.total_qty||qtyOf(l)));
const itemsLine=it=>it.map(i=>i.item+" ("+nf(i.qty)+")").join("، ");
const itemsTxt=l=>itemsLine(itemsOf(l));
const hitQ=(...a)=>!Q||norm(a.join(" ")).includes(norm(Q));
const kilnBusy=id=>O.find(o=>o.kiln_id===id&&o.status==="in_kiln")||null;
const kilnsFor=kind=>K.filter(k=>k.active&&k.kind===kind);
const unsetKilns=()=>K.filter(k=>k.active&&!k.kind);
const dlFile=(name,txt,type)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+txt],{type:type||"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};

function dur(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),h=Math.floor(m/60),r=m%60;return h?nf(h)+" ساعة"+(r?" و"+nf(r)+" دقيقة":""):nf(r)+" دقيقة"}

function errMsg(e){
  const m=String((e&&e.message)||e||"");
  if(!navigator.onLine||/failed to fetch|networkerror|load failed|network request/i.test(m))return"مفيش إنترنت أو الاتصال ضعيف — ما اتحفظش حاجة، حاول تاني لما النت يرجع";

function itemRow(it){

const kilnOpts=(kind,sel,ownOp)=>{
  const ks=kilnsFor(kind);if(!ks.length)return"";
  return ks.map(k=>{const b=kilnBusy(k.id),mine=b&&ownOp&&b.id===ownOp;return `<option value="${k.id}" ${k.id===sel?"selected":""}>${esc(k.name)}${b&&!mine?" (مشغول)":""}</option>`}).join("");

const readItems=()=>[...document.querySelectorAll("#f-items .irow")].map(r=>({item:r.querySelector(".it").value.trim(),qty:parseInt(r.querySelector(".iq").value)||0})).filter(i=>i.item||i.qty);
function checkItems(items,req){
  if(req&&!items.length){toast("ضيف صنف واحد على الأقل");return false}
  for(const i of items){
    if(!i.item){toast("اختار اسم الصنف");return false}
    if(i.qty<1){toast("اكتب كمية صحيحة لصنف: "+i.item);return false}
    if(CAT&&CAT.item&&!CAT.item.some(n=>norm(n)===norm(i.item))){toast("الصنف «"+i.item+"» مش مسجّل في الأصناف — اختاره من القائمة");return false}
  }

}
function wireItems(start){
  const box=document.getElementById("f-items"),tot=document.getElementById("f-tot");
  const upd=()=>{const t=[...box.querySelectorAll(".iq")].reduce((a,e)=>a+(parseInt(e.value)||0),0);tot.textContent=t?"إجمالي القطع: "+nf(t):""};
  const add=it=>{box.insertAdjacentHTML("beforeend",itemRow(it));upd()};
  box.addEventListener("input",upd);
  box.addEventListener("click",e=>{const b=e.target.closest(".irm");if(!b)return;if(box.querySelectorAll(".irow").length<2){const r=b.closest(".irow");r.querySelector(".it").value="";r.querySelector(".iq").value="";upd();return}b.closest(".irow").remove();upd()});
  document.getElementById("f-add").onclick=()=>add();
  box.innerHTML="";(start&&start.length?start:[null]).forEach(add);
  return {add,upd,box,reset:its=>{box.innerHTML="";(its&&its.length?its:[null]).forEach(add)}};
}

/* ---------- صور العداد ---------- */
function shrink(file,max=1600,q=.8){return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type))return rej(new Error("اختار ملف صورة"));
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{try{
    const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error("تعذّر تجهيز الصورة")),"image/jpeg",q);
  }catch(e){rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("الصورة غير صالحة"))};
  im.src=url;
})}
let _up=false;
function pickPhoto(opId,replaces,gallery){
  if(roBlock())return;
  if(_up){toast("استنى لحد ما الصورة اللي بتترفع تخلص","warn");return}
  const inp=document.getElementById(gallery?"galIn":"camIn");inp.value="";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    _up=true;toast("جاري رفع الصورة… ما تقفلش الصفحة","warn");
    let path=null,uploaded=false;
    try{
      if(!navigator.onLine)throw new Error("failed to fetch");
      const blob=await shrink(f);
      path=opId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
      const up=await db.storage.from(BUCKET).upload(path,blob,{contentType:"image/jpeg",upsert:false});
      if(up.error)throw up.error;uploaded=true;
      await rpc("firing_add_photo",{p_op:opId,p_path:path,p_size:blob.size,p_replaces:replaces||null});
      toast("تم حفظ صورة العداد");
      await load();
      const pv=document.getElementById("pbody");if(pv&&pv.dataset.op==+opId)openOp(opId);
    }catch(e){
      if(uploaded&&path){try{await db.storage.from(BUCKET).remove([path])}catch(x){}}
      toast("الصورة ما اتحفظتش — "+errMsg(e),"bad");
    }finally{_up=false}
  };
  inp.click();
}
async function photosFor(opId){
  const r=await db.from("firing_meter_photos").select("*").eq("operation_id",opId).order("taken_at",{ascending:true}).order("id",{ascending:true});
  if(r.error)throw r.error;
  const rows=r.data||[];let urls={};
  if(rows.length){const s=await db.storage.from(BUCKET).createSignedUrls(rows.map(p=>p.storage_path),3600);if(!s.error)(s.data||[]).forEach(x=>{if(x.signedUrl)urls[x.path]=x.signedUrl})}
  return rows.map(p=>({...p,url:urls[p.storage_path]||""}));
}

}
function zoom(url){

const ACT_AR={insert:"إضافة",update:"تعديل",delete:"حذف"};
const FLD={cart_code:"رقم العربية",loaded_at:"وقت الشحن",entered_at:"وقت الدخول",finished_at:"وقت الإطفاء",tubes_used:"الأنابيب",worker:"العامل/المسؤول",note:"ملاحظة",kiln_id:"الفرن",status:"الحالة",total_qty:"الإجمالي",items:"الأصناف",name:"الاسم",kind:"النوع",active:"شغّال",load_id:"الشحنة المرتبطة",path:"المسار",operation_id:"العملية"};
const SKIP=new Set(["id","created_at","updated_at","created_by","created_by_name","updated_by_name","photo_count","last_photo_at","approved_at","approved_by","approved_by_name","finished_by","finished_by_name","photos"]);
function fv(k,v){
  if(v===null||v===undefined||v==="")return"—";
  if(k==="items")return Array.isArray(v)&&v.length?itemsLine(v):"—";
  if(/_at$/.test(k))return fmtT(v);
  if(k==="kiln_id"){const x=Kk(+v);return x?x.name:"فرن #"+v}
  if(k==="kind")return KAR[v]||v;
  if(k==="status")return OST[v]||LST[v]||v;
  if(k==="active")return v?"نعم":"لا";
  return String(v);
}
function diffHtml(e){
  const b=e.before_data||{},a=e.after_data||{};
  const keys=[...new Set([...Object.keys(b),...Object.keys(a)])].filter(k=>!SKIP.has(k));
  if(e.action==="update"){
    const rows=keys.filter(k=>JSON.stringify(b[k])!==JSON.stringify(a[k])).map(k=>`<tr><td>${FLD[k]||esc(k)}</td><td class="old">${esc(fv(k,b[k]))}</td><td class="new">${esc(fv(k,a[k]))}</td></tr>`);
    return rows.length?`<table class="ftb adt"><thead><tr><th>الحقل</th><th>قبل</th><th>بعد</th></tr></thead><tbody>${rows.join("")}</tbody></table>`:'<div class="nums">مفيش تغيير في الحقول الظاهرة</div>';
  }
  const src=e.action==="insert"?a:b,rows=keys.filter(k=>src[k]!==null&&src[k]!==undefined&&src[k]!=="").map(k=>`<tr><td>${FLD[k]||esc(k)}</td><td colspan="2">${esc(fv(k,src[k]))}</td></tr>`);
  return `<table class="ftb adt"><tbody>${rows.join("")}</tbody></table>`;
}

const purgeCard=()=>`<div class="card noprint" style="padding:10px 12px;margin-top:8px;border-color:#b3261e55"><b>حذف البيانات القديمة (للمدير فقط)</b><div class="nums" style="margin:4px 0">بيحذف الشحنات والعمليات المكتملة اللي قبل التاريخ ده. كل سجل بيتسجّل في المراجعة وتقدر تسترجعه (إلا صور العداد).</div><label>احذف كل اللي قبل تاريخ</label><input type="date" id="pg-d" max="${new Date(Date.now()-7*864e5).toISOString().slice(0,10)}"><button class="btn ghost dangerbtn" data-a="purge" style="margin-top:8px">معاينة ثم حذف</button></div>`;
async function purgeOld(){
  if(roBlock())return;if(!isAdminU())return toast("للمدير فقط","warn");
  const d=(document.getElementById("pg-d")||{}).value;if(!d){toast("اختار التاريخ");return}
  let pv;try{pv=await rpc("firing_purge_old",{p_before:d,p_dry:true})}catch(x){return fail_(x)}
  if(!pv.loads&&!pv.operations){toast("مفيش بيانات قبل التاريخ ده");return}
  if(!await ask("هيتحذف "+nf(pv.loads)+" شحنة و"+nf(pv.operations)+" عملية حريق مكتملة قبل "+d+". صور العداد هتتمسح نهائيًا. متأكد؟","نعم، احذف"))return;
  try{
    const r=await rpc("firing_purge_old",{p_before:d,p_dry:false});
    const paths=Array.isArray(r.paths)?r.paths:[];
    for(let i=0;i<paths.length;i+=100){try{await db.storage.from(BUCKET).remove(paths.slice(i,i+100))}catch(x){}}

.pg{max-width:190mm;margin:0 auto;padding:0 0 14mm}

table{width:100%;border-collapse:collapse;margin:6px 0 12px}
th{background:#642631;color:#fff;font-size:14px;padding:8px 8px;text-align:start}

function rptDoc(title,body,landscape){
  const logo=new URL("icon-512.png",location.href).href;
  return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>${RPT_CSS}${landscape?"@page{size:A4 landscape;margin:10mm 10mm 16mm}.pg{max-width:277mm}@media screen{.pg{width:297mm}}.cards{grid-template-columns:repeat(4,1fr)}":""}</style></head><body><div class="pg">
  <header class="hd"><img src="${esc(logo)}" alt="MAS"><div class="br"><b>MAS</b><span>الماس للخزف والصيني</span></div>${body.head}<div class="mt">تاريخ الطباعة<b>${esc(fmtF(new Date()))}</b>${ME&&ME.name?"طُبع بواسطة<b>"+esc(ME.name)+"</b>":""}</div></header>
  ${body.main}
  <div class="ft"><span>MAS — الماس للخزف والصيني · قسم الحريق والشحن</span><span>${esc(title)}</span></div></div></body></html>`;
}
function showReport(html,title){
  const old=document.querySelector(".rpv");if(old)old.remove();
  const d=document.createElement("div");d.className="rpv";
  d.innerHTML=`<div class="rpv-bar noprint"><b>${esc(title)}</b><button class="btn sm" id="rpv-p">${ib("print","طباعة")}</button><button class="btn sm" id="rpv-d">${ib("download","تصدير PDF")}</button><button class="btn ghost sm" id="rpv-c">${ib("x","إغلاق")}</button></div><iframe class="rpv-fr" title="${esc(title)}"></iframe>`;
  document.body.appendChild(d);
  const fr=d.querySelector("iframe");fr.srcdoc=html;
  // على الموبايل: بنصغّر المعاينة على الشاشة بس لتناسب العرض (الطباعة والـ PDF بتفضل بالحجم الحقيقي A4)
  fr.onload=()=>{try{const dc=fr.contentDocument,pgw=dc.querySelector(".pg");if(!pgw)return;const z=Math.min(1,(fr.clientWidth-8)/(pgw.offsetWidth+24));if(z<1){const s=dc.createElement("style");s.media="screen";s.textContent="body{zoom:"+z.toFixed(3)+"}";dc.head.appendChild(s)}}catch(e){}};
  const close=()=>{document.removeEventListener("keydown",esc_);d.remove()},esc_=e=>{if(e.key==="Escape")close()};
  document.addEventListener("keydown",esc_);
  d.querySelector("#rpv-c").onclick=close;
  const go=async pdf=>{try{const w=fr.contentWindow;try{await w.document.fonts.ready}catch(x){}
    await Promise.all([...w.document.images].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;setTimeout(r,6000)})));
    if(pdf)toast("في نافذة الطباعة اختار «حفظ كملف PDF» — الملف هيطلع مطابق للمعاينة","warn");
    w.focus();w.print()}catch(e){toast("تعذّرت الطباعة","bad")}};
  d.querySelector("#rpv-p").onclick=()=>go(false);d.querySelector("#rpv-d").onclick=()=>go(true);
}
const kvRows=(pairs)=>{const p=pairs.filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!==""&&x[1]!=="—");let h="";for(let i=0;i<p.length;i+=2)h+=`<tr><td>${p[i][0]}</td><td>${p[i][1]}</td>${p[i+1]?`<td>${p[i+1][0]}</td><td>${p[i+1][1]}</td>`:"<td></td><td></td>"}</tr>`;return h?`<table class="kv">${h}</table>`:""};
const itemsPrint=(it,tot)=>it.length?`<table><thead><tr><th style="width:8%">م</th><th>الصنف</th><th style="width:22%">الكمية</th></tr></thead><tbody>${it.map((i,n)=>`<tr><td>${nf(n+1)}</td><td>${esc(i.item)}</td><td><b>${nf(i.qty)}</b></td></tr>`).join("")}</tbody><tfoot><tr><td colspan="2">الإجمالي</td><td>${nf(tot)}</td></tr></tfoot></table>`:"";

  <h2>الجدول الزمني</h2><div class="tl"><div><small>بداية الحريق (دخول الفرن)</small><b>${esc(o.entered_at?fmtF(o.entered_at):"لسه ما دخلتش الفرن")}</b></div><div><small>نهاية الحريق (إطفاء الفرن)</small><b>${esc(o.finished_at?fmtF(o.finished_at):"لسه شغّال / لم ينتهِ")}</b></div></div>

  ${o.note?`<h2>الملاحظات</h2><div class="nt">${esc(o.note)}</div>`:""}
  ${ps.length?`<h2>صور العداد (${nf(ps.length)})</h2><div class="ph">${ps.map(p=>p.url?`<figure><img src="${esc(p.url)}" alt="صورة العداد"><figcaption>${esc(fmtF(p.taken_at))}${p.uploaded_by_name?" — "+esc(p.uploaded_by_name):""}</figcaption></figure>`:"").join("")}</div>`:""}
  <div class="sg"><div>توقيع العامل المسؤول</div><div>توقيع مشرف القسم</div></div>`;
  showReport(rptDoc("تقرير حريق "+KAR[o.kind]+" #"+o.id+(cart?" — عربية "+cart:""),{head,main}),"تقرير حريق #"+o.id);
}

let R={type:"biscuit",from:"",to:"",cart:"",worker:"",st:""};
const RTY={fire:"عمليات الحريق",biscuit:"شحن البسكوت",glaze:"شحن الجليز"};
function repData(){
  const ty=R.type,inR=t=>{const d=dayOf(t);return(!R.from||d>=R.from)&&(!R.to||d<=R.to)};
  const okC=c=>!R.cart||norm(c).includes(norm(R.cart)),okW=w=>!R.worker||norm(w||"").includes(norm(R.worker));
  if(ty==="fire"){
    const rows=O.filter(o=>inR(o.entered_at||o.created_at)&&okC(opCart(o))&&okW(o.worker)&&(!R.st||o.status===R.st)).sort((a,b)=>new Date(a.entered_at||a.created_at)-new Date(b.entered_at||b.created_at));
    return {rows,tot:rows.reduce((a,o)=>a+opTotal(o),0),items:sumItems(rows.map(opItems))};
  }
  const rows=L.filter(l=>l.kind===ty&&inR(l.loaded_at)&&okC(l.cart_code)&&okW(l.worker||l.created_by_name)).sort((a,b)=>new Date(a.loaded_at)-new Date(b.loaded_at));
  return {rows,tot:rows.reduce((a,l)=>a+(l.total_qty||qtyOf(l)),0),items:sumItems(rows.map(itemsOf))};
}
function sumItems(lists){const m=new Map();lists.forEach(it=>it.forEach(i=>m.set(i.item,(m.get(i.item)||0)+(+i.qty||0))));return[...m.entries()].map(([item,qty])=>({item,qty})).sort((a,b)=>b.qty-a.qty)}

  if(tab==="log"){
    const lg={kind:"lf-kind",kiln:"lf-kiln",st:"lf-st",from:"lf-from",to:"lf-to",item:"lf-item"};
    Object.entries(lg).forEach(([key,id])=>{const e=document.getElementById(id);if(!e)return;e.value=LF[key];e.addEventListener(e.tagName==="INPUT"&&e.type!=="date"?"input":"change",()=>{LF[key]=e.value;const pos=e.selectionStart;render();const n=document.getElementById(id);if(n&&e.tagName==="INPUT"&&e.type!=="date"){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}})});
    document.getElementById("lf-csv").onclick=exportCsv;document.getElementById("lf-pr").onclick=printLog;
    document.getElementById("lf-clr").onclick=()=>{LF={kind:"",kiln:"",st:"",from:"",to:"",item:""};render()};
  }
  if(tab==="prt"){
    const bind=(id,key,ev)=>{const e=document.getElementById(id);if(!e)return;e.addEventListener(ev||"change",()=>{R[key]=e.value;const pos=e.selectionStart;render();const n=document.getElementById(id);if(n&&e.tagName==="INPUT"&&e.type!=="date"){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}})};
    bind("r-from","from");bind("r-to","to");bind("r-cart","cart","input");bind("r-w","worker","input");bind("r-st","st");
    const t=document.getElementById("r-type");if(t)t.onclick=e=>{const b=e.target.closest("button[data-k]");if(!b)return;R.type=b.dataset.k;R.st="";render()};
  }
}
document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-go]");if(g){location.hash="#"+g.dataset.go;return}
  const z=e.target.closest("[data-zoom]");if(z){zoom(z.dataset.zoom);return}
  const of=e.target.closest("[data-of]");if(of){OF=of.dataset.of;render();return}
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,id=+b.dataset.id;
  if(a==="newfire"){closeModal();return fireForm(b.dataset.k)}
  if(a==="newship"){return shipForm(b.dataset.k)}
  if(a==="shipedit")return shipForm(null,id);
  if(a==="shipdel")return delShip(id);
  if(a==="shipprt")return printShip(id);
  if(a==="opedit"){closeModal();return fireForm(null,id)}
  if(a==="opdel")return delFire(id);
  if(a==="hist")return showHist(b.dataset.e,id);
  if(a==="restore")return restoreAud(id);
  if(a==="purge")return purgeOld();
  if(a==="ldok"){if(roBlock())return;if(!await ask("اعتماد شحن العربية؟","نعم، اعتمد"))return;try{await rpc("firing_approve_load",{p_id:id});await load();toast("تم اعتماد الشحن")}catch(x){fail_(x)}return}
  if(a==="opview")return openOp(id);
  if(a==="shot")return pickPhoto(id,null,false);
  if(a==="gal")return pickPhoto(id,null,true);
  if(a==="reup")return pickPhoto(id,+b.dataset.p,false);
  if(a==="fin"){closeModal();return finForm(id)}
  if(a==="enter")return enterForm(id);
  if(a==="prt")return printOp(id);
  if(a==="kedit"){closeModal();return kilnForm(id)}
  if(a==="kadd")return kilnForm(0);
  if(a==="rprint")return printPeriod(false);
  if(a==="rpdf")return printPeriod(true);
  if(a==="rcsv")return repCsv();
  if(a==="rtoday"){R.from=R.to=today();render();return}
  if(a==="rclr"){R={...R,from:"",to:"",cart:"",worker:"",st:""};render();return}
});
const goTab=t=>{if(location.hash==="#"+t){tab=t;setTab()}else location.hash="#"+t};
document.getElementById("ftabs").addEventListener("click",e=>{const b=e.target.closest("button[data-t]");if(!b)return;goTab(b.dataset.t)});
document.getElementById("fq").addEventListener("input",e=>{Q=e.target.value;render()});
setInterval(()=>{if(document.hidden||document.getElementById("ov")||_up)return;load()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!document.getElementById("ov"))load()});
(async()=>{if(await requireAuth("fire.html")){renderNav("fire.html");drawTabs();load().finally(settle)}})();

</script>
<script src="install.js" defer></script>
